s":[479,480]},{"text":"If you feel stuck in your head, anxious, or depressed, focus on your surroundings. Better yet, do something that forces it—exercise, reading, or music.","pages":[481]}],"numbers":[{"text":"That's how often our minds are elsewhere, according to the 2010 Killingsworth and Gilbert study.","pages":[476],"label":"Mind wandering","value":"Nearly 50% of waking life"},{"text":"Huberman's view of moderate use—which can be great for learning, social interaction, and entertainment.","pages":[478],"label":"Social media","value":"About an hour or so daily"},{"text":"Women with the most mind wandering versus those with low amounts. That's equal to about four years of extra aging.","pages":[479],"label":"Telomere gap","value":"~200 base pairs shorter"},{"text":"Worth doing every few weeks, or once a month.","pages":[480],"label":"Stumpf exercise","value":"Five minutes at most"}],"cautions":[{"text":"Feeling sad or angry is sometimes warranted and healthy—and suppressing negative feelings is linked to poorer health. The real problem is staying stuck in low moods too long.","pages":[477]},{"text":"Be careful: mind wandering during hard negative experiences, emotional or physical, was found to harm immediate and future mood.","pages":[477]},{"text":"Watch out for texting, scrolling, or doing anything at all out of boredom or avoidance.","pages":[479]},{"text":"Caution: clinical major depression deserves professional support.","pages":[481]}],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"growth-02","number":2,"title":"Apply James Hollis’s Guide to Creating Your Best Life","page":482,"summary":{"text":"Two daily practices from psychologist James Hollis: live by the motto \"Shut Up. Suit Up. Show Up.\" and let your internal maps update by stepping out of stimulus-response mode. Together, they align your outward and inner lives.","pages":[482]},"why":[{"text":"When your outward and inner lives conflict, things take more energy. You second-guess yourself. You ruminate. You feel more tired from less effort.","pages":[483]},{"text":"Here's why showing up matters: how you feel about your self-worth and self-esteem is strongly shaped by fulfilling your outward roles.","pages":[484]},{"text":"Seeding thoughts of gratitude suppresses negative thoughts. And even a few minutes of gratitude practice has been shown to lift motivation and mood.","pages":[485]},{"text":"The payoff of stepping out of stimulus-response mode: it lets you separate what you think others think of you from what you actually know is true.","pages":[492]}],"steps":[{"text":"Write down Hollis's motto—\"Shut Up. Suit Up. Show Up.\"—carry it with you, and recite it every morning and throughout the day, as he recommends.","pages":[483]},{"text":"Shut Up: don't whine. Instead, spend a minute or five each day finding something you're grateful for that you'd otherwise miss or take for granted.","pages":[483,485]},{"text":"Or try other gratitude routes: stories (documentaries, books, movies) where someone thanks others—or ask friends, family, and colleagues when they felt grateful for you.","pages":[488]},{"text":"Suit Up: design your own task-switching ritual you can do almost anywhere. Physical actions work better than mantras. Use it between tasks.","pages":[482,489]},{"text":"Prepare for your roles (get adequate sleep, don't overbook, be on time). Then show up—hold yourself accountable at work and in your relationships.","pages":[484]},{"text":"Each day, do something unrelated to your ambitions or roles—draw, read, stare at the sky. Do it alone, with no social media or posting.","pages":[492]},{"text":"As well, or instead: simply close your eyes, ask how you're feeling, and notice what brings you joy or makes you uncomfortable.","pages":[492]}],"numbers":[{"text":"Your daily time for finding something to be grateful for.","pages":[485],"label":"Gratitude time","value":"A minute, or five"},{"text":"That's how much switch costs can reduce mental and physical performance.","pages":[489],"label":"Switch cost","value":"15 to 40 percent"},{"text":"Even this little time on an activity unrelated to your roles can make a meaningful difference.","pages":[492],"label":"Solo activity","value":"Even just ten minutes"},{"text":"Huberman tries to step away from devices and stand or sit quietly.","pages":[495],"label":"Author's quiet time","value":"At least 5 minutes a day"},{"text":"Huberman aims to spend this on something unrelated to work or routine demands.","pages":[495],"label":"Author's hobby time","value":"At least an hour a week"}],"cautions":[{"text":"\"Shut Up\" doesn't mean suppressing your feelings. Hollis is all about acknowledging them.","pages":[483]},{"text":"Want to task switch well? Don't fill every gap between activities with your smartphone.","pages":[490]},{"text":"A walk can work to exit stimulus-response mode—as long as you don't turn it into physically demanding exercise. Leave the phone at home.","pages":[496]},{"text":"Sometimes you need help and encouragement from others—and psychotherapy can be extremely beneficial.","pages":[493]}],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"},{"text":"morning"}],"schedule":[]},{"id":"growth-03","number":3,"title":"Resolve Inner Pain Points Through Expressive Writing","page":497,"summary":{"text":"Write honestly about a challenging experience for 15–20 minutes a day, four days in a row. The aim is to help you move past old wounds, and it has shown mental and physical health benefits.","pages":[497,500,501]},"why":[{"text":"In Pennebaker's first study, trauma writers felt worse and had higher blood pressure right after writing. But over the next six months, they had fewer health center visits.","pages":[498]},{"text":"A follow-up study's conclusion: writing about trauma boosted immune function, reduced stress, and led to less physical illness.","pages":[499]},{"text":"Honest, cohesive narratives appear to stimulate the prefrontal cortex. In other words, the exercise likely works by avoiding amygdala activation and engaging the prefrontal cortex instead.","pages":[499,500]},{"text":"Why four days? That allows deeper reflection and a comparison of how you felt then and now—without it becoming open-ended rumination.","pages":[500]}],"steps":[{"text":"Write for 15–20 minutes about a challenging experience that affected your life.","pages":[497]},{"text":"Do it four times: once a day, four days in a row.","pages":[497]},{"text":"Set a timer and stop at twenty minutes—even if you feel you could keep going.","pages":[497]},{"text":"Don't fret over the quality of your writing—you're the only one who will read it.","pages":[497]},{"text":"Cover what happened, what you felt then, what you feel now, and any lasting effects. Be honest about every part of it.","pages":[497]},{"text":"Do it whenever you can set aside the time—plus perhaps a few minutes to recover before your next activity.","pages":[501]}],"numbers":[{"text":"Never go past twenty minutes in a session.","pages":[497],"label":"Session length","value":"15–20 minutes"},{"text":"One session a day, four days in a row.","pages":[497],"label":"Sessions","value":"4, on consecutive days"}],"cautions":[{"text":"This isn't a cure for emotional pain. Therapy or other interventions are often needed. If you're suffering, don't hesitate to seek professional help.","pages":[501]},{"text":"A formal assessment from a qualified psychologist or psychiatrist is the only way to know if you have trauma.","pages":[498]},{"text":"Be ready: this isn't necessarily comfortable. It asks you to revisit very difficult experiences, and the goal isn't feeling good in the short term.","pages":[500]},{"text":"Pennebaker's own advice: if it doesn't work for you, stop.","pages":[501]}],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"growth-04","number":4,"title":"Reframe Loss to Effectively Move Through Grief","page":502,"summary":{"text":"A neuroscience-based framework that may help you cope with loss: see grief as a missing expected reward, fully feel your attachment daily, and avoid what-if thinking—so you don't get stuck in prolonged grief.","pages":[502,503]},"why":[{"text":"Brain imaging shows grief activates motivation and craving circuits. Researchers hypothesized that grief is like searching for a reward that never arrives.","pages":[503,504]},{"text":"Grief is also a difficult learning process. Your brain's maps still expect the person, and it takes time for them to update.","pages":[502,505]},{"text":"Avoidance makes this learning harder. That's because it stops new information from being added to the map.","pages":[505]},{"text":"Taking time to feel the attachment lets your brain consolidate new memories and build new maps (meaning, expectations) about your life.","pages":[505]}],"steps":[{"text":"Understand grief as a lack of reward. Your brain learned to expect things like a person's voice or smell—and that reward is no longer there.","pages":[502]},{"text":"Each day, spend 10–30 minutes deeply feeling your attachment to the person, animal, or thing you're grieving. Don't dampen it; experience it fully.","pages":[502]},{"text":"Consider small grief rituals some researchers suggest: lighting a candle, spending time with a photograph, or writing the person a letter.","pages":[505]},{"text":"Steer clear of what-if thoughts. Try not to replay how else things might have gone.","pages":[502]},{"text":"Give yourself time and space to be with your feelings of attachment and closeness. Let the process unfold.","pages":[507]}],"numbers":[{"text":"Your daily time to deeply feel your attachment to what you're grieving.","pages":[502],"label":"Daily feeling time","value":"10–30 minutes a day"},{"text":"Psychologists tend to consider grief prolonged when it's debilitating and lasts this long.","pages":[506],"label":"Prolonged grief","value":"More than a year"}],"cautions":[{"text":"Don't use this protocol in place of tools from bereavement research, such as cognitive behavioral therapy for prolonged grief.","pages":[503]},{"text":"Bereavement research says to be wary of heavy drinking in the year or two after a death—and to stay in the flow of life, like dinner plans and exercise.","pages":[503]},{"text":"Don't suppress the pain or ask why you're not over it. Above all, don't ruminate on \"if only\"—one study linked it to longer grieving and depression symptoms.","pages":[506]}],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]}]}],"claims":870,"disclaimer":{"page":5,"text":"The book shares its author's opinions and ideas as helpful information, not as medical, health or other professional services. It advises readers to consult a medical, health or other competent professional before adopting any of its suggestions or drawing inferences from it."}};
</script>
<script>
(() => {
'use strict';
const CH = DATA.chapters;
const ALL = CH.flatMap(c => c.protocols.map(p => ({ ...p, ch: c })));
const BY_ID = Object.fromEntries(ALL.map(p => [p.id, p]));
const WHEN = ['morning','daytime','afternoon','evening','bedtime','anytime','as-needed'];
const WHEN_LABEL = { morning:'Morning', daytime:'Daytime', afternoon:'Afternoon', evening:'Evening', bedtime:'Bedtime', anytime:'No set time', 'as-needed':'As needed' };
const TAG_LABEL = { light:'Light', breathing:'Breathing', movement:'Movement', temperature:'Temperature', food:'Food', drink:'Drink', supplements:'Supplements', medication:'Medication', rest:'Rest', mindset:'Mindset', timing:'Timing', environment:'Environment' };
/* one emissive hue per chapter, drawn from the screen's palette */
const DUSK_HUE = { sleep:'#7C86A4', exercise:'#D96546', stress:'#4B8197', nutrition:'#BC7394', light:'#E87A32', learning:'#A090B4', growth:'#AFD3C6' };
const BLOOM_HUE = { sleep:'#798DA1', exercise:'#BD5129', stress:'#1A71A4', nutrition:'#9E7C38', light:'#CF6708', learning:'#7D5AA3', growth:'#B18790' };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const pad = n => String(n).padStart(2, '0');
const pgs = a => { const u = [...new Set(a || [])].sort((x, y) => x - y); return u.length ? 'P.' + u.join(', ') : ''; };
const pgTag = a => a && a.length ? ` <span class="pg">${pgs(a)}</span>` : '';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- per-viewer storage (this browser only) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('hal.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hal.' + k, JSON.stringify(v)); } catch {} }
};
const today = () => new Date().toISOString().slice(0, 10);
let plan = store.get('plan', []).filter(id => BY_ID[id]);
let times = store.get('times', { wake: '07:00', bed: '23:00' });
let done = store.get('done', { day: today(), ids: {} });
if (done.day !== today()) done = { day: today(), ids: {} };
let mode = store.get('mode', 'auto');
let browseState = { q: '', ch: [], when: [], tag: [] };
const chFilter = {};
const inPlan = id => plan.includes(id);
function savePlan() { store.set('plan', plan); updateBadge(); }
function setDone(k, v) { done.ids[k] = v; store.set('done', done); }

/* ---------- theme (Fog / Night / follow the device) ---------- */
function applyMode() {
  const r = document.documentElement;
  if (mode === 'auto') delete r.dataset.mode; else r.dataset.mode = mode;
}
applyMode();

/* ---------- film grain: one cached 256px tile ---------- */
try {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const cx = cv.getContext('2d'), im = cx.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) {
    const g = 128 + ((Math.random() + Math.random() + Math.random() - 1.5) * 110);
    im.data[i] = im.data[i + 1] = im.data[i + 2] = g; im.data[i + 3] = 255;
  }
  cx.putImageData(im, 0, 0);
  document.documentElement.style.setProperty('--grain-url', `url(${cv.toDataURL()})`);
  /* Fog: light speckle (white and soft-dark flecks, mostly clear) so the grain never greys the colour */
  for (let i = 0; i < im.data.length; i += 4) {
    if (Math.random() < .5) { im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = Math.random() * 70; }
    else { im.data[i] = 96; im.data[i + 1] = 86; im.data[i + 2] = 78; im.data[i + 3] = Math.random() * 38; }
  }
  cx.putImageData(im, 0, 0);
  document.documentElement.style.setProperty('--grain-fog-url', `url(${cv.toDataURL()})`);
} catch {}
document.addEventListener('visibilitychange', () => document.body.classList.toggle('paused', document.hidden));

/* ---------- icons ---------- */
const I = {
  back: '<svg viewBox="0 0 24 24"><path class="ico" d="M14.5 5.5 8 12l6.5 6.5"/></svg>',
  menu: '<svg viewBox="0 0 24 24"><path class="ico" d="M4.5 7.5h15M4.5 12h15M4.5 16.5h9"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path class="ico" d="m6.5 6.5 11 11m0-11-11 11"/></svg>',
  arrow: '<svg viewBox="0 0 16 16"><path class="ico" d="M3 8h10M9 4l4 4-4 4"/></svg>',
  arrowL: '<svg viewBox="0 0 16 16"><path class="ico" d="M13 8H3M7 4 3 8l4 4"/></svg>',
  chev: '<svg viewBox="0 0 16 16"><path class="ico" d="m6 3.5 4.5 4.5L6 12.5"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle class="ico" cx="10.5" cy="10.5" r="6"/><path class="ico" d="m15 15 5 5"/></svg>',
  check: '<svg viewBox="0 0 16 16"><path class="ico" style="stroke-width:1.75" d="m3.5 8.5 3 3 6-7"/></svg>',
  plus: '<span><i></i><i></i></span>'
};

/* ---------- instrument glyphs: line plus one solid; the value f (0–1) is the share of the chapter in your plan ---------- */
const polar = (r, deg, cx = 60, cy = 60) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
function glyph(key, f) {
  f = Math.max(0, Math.min(1, f || 0));
  let s = '';
  if (key === 'sleep') { // ring gauge
    const r = 9 + 33 * f;
    s = `<circle class="ln" cx="60" cy="60" r="50"/><circle class="ln2" cx="60" cy="60" r="43" stroke-dasharray="2 4"/>
      <circle class="sol" data-r="${r}" cx="60" cy="60" r="${r}"/>`;
  } else if (key === 'exercise') { // semicircular gauge with needle
    let t = ''; for (let a = 180; a <= 360; a += 10) { const maj = (a - 180) % 30 === 0; const [x1, y1] = polar(46, a, 60, 80), [x2, y2] = polar(46 - (maj ? 8 : 5), a, 60, 80); t += `<line class="${maj ? 'ln' : 'ln2'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    s = `<path class="ln" d="M8 80h104"/><path class="ln" d="M14 80a46 46 0 0 1 92 0"/>${t}
      <g class="needle" data-deg="${f * 180}" style="transform: rotate(${f * 180}deg)"><path class="ln" style="stroke-width:1.5" d="M60 80H24"/><path class="sol" d="M22 80l7-3.2v6.4z"/></g><circle class="sol" cx="60" cy="80" r="5.5"/>`;
  } else if (key === 'stress') { // ripple
    const lit = Math.round(f * 5); let e = '';
    for (let i = 0; i < 5; i++) { const rx = 52 - i * 9, ry = (22 - i * 3.6); e += `<ellipse class="${i >= 5 - lit ? 'ln' : 'ln2'}" cx="60" cy="${66 - i * 7}" rx="${rx}" ry="${ry}"/>`; }
    s = `${e}<ellipse class="ln" style="stroke-width:1.5" cx="60" cy="96" rx="40" ry="5"/><ellipse class="sol" cx="60" cy="38" rx="7" ry="3.5"/>`;
  } else if (key === 'nutrition') { // ring with sector
    const a = Math.max(.02, f) * 359.9, [x, y] = polar(38, -90 + a), large = a > 180 ? 1 : 0;
    s = `<circle class="ln" cx="60" cy="60" r="50"/><circle class="ln2" cx="60" cy="60" r="38"/>
      <path class="sol" d="M60 60 L60 22 A38 38 0 ${large} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z"/>`;
  } else if (key === 'light') { // sunrise over the horizon
    const dy = (1 - f) * 24;
    s = `<defs><clipPath id="sky"><rect x="0" y="0" width="120" height="70"/></clipPath></defs>
      <path class="ln2" d="M20 70a40 40 0 0 1 80 0"/><path class="ln" d="M8 70h104"/>
      <g clip-path="url(#sky)"><path class="sol rise" style="transform: translateY(${dy}px)" d="M36 70a24 24 0 0 1 48 0z"/></g>
      <path class="ln" d="M60 22V8m-5 5 5-5 5 5"/><path class="ln2" d="M24 80h72M36 89h48M48 98h24"/>`;
  } else if (key === 'learning') { // compass / heading
    const d = f * 360;
    s = `<circle class="ln" cx="60" cy="60" r="50"/><path class="ln2" d="M60 14v6M60 100v6M14 60h6M100 60h6"/>
      <text x="60" y="27" text-anchor="middle" style="font:500 9px var(--mono);letter-spacing:.14em;fill:currentColor">N</text>
      <path class="ln" d="M56 8h8l-4-5z" style="fill:none"/>
      <g class="needle" style="transform-origin:60px 60px; transform: rotate(${d}deg)"><path class="ln" style="stroke-width:1.5" d="M60 60V36"/><path class="ln" d="M56.5 40.5l3.5-5 3.5 5"/></g>
      <circle class="sol" cx="60" cy="60" r="10"/>`;
  } else { // growth: tick ring with comet
    const n = 36, lit = Math.round(f * n); let t = '';
    for (let i = 0; i < n; i++) {
      const on = i < lit, comet = on && i >= lit - 5, k = comet ? (i - (lit - 5)) / 4 : 0;
      const len = on ? (comet ? 9 + 6 * k : 9) : 7, w = on ? (comet ? 1.25 + 1 * k : 1.25) : 1;
      const [x1, y1] = polar(50, -90 + i * 10), [x2, y2] = polar(50 - len, -90 + i * 10);
      t += `<line class="tick ${on ? 'ln' : 'ln2'}" style="stroke-width:${w}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
    }
    s = `${t}<circle class="sol" cx="60" cy="60" r="9"/>`;
  }
  return `<svg class="g" viewBox="0 0 120 120" role="img" aria-label="${Math.round(f * 100)}% of the book's protocols">${s}</svg>`;
}
const chFrac = c => c.protocols.length / ALL.length;
/* µ5 / µ6 — first view per session: instruments calibrate (sweep to max, settle on the value) */
let calDone = false;
function calibrate(root) {
  if (REDUCE.matches) return;
  if (calDone) return; calDone = true; const seenCal = false;
  root.querySelectorAll('.g').forEach((svg, gi) => {
    const nd = svg.querySelector('.needle');
    if (nd) {
      const v = getComputedStyle(nd).transform;
      nd.animate(seenCal ? [{ transform: 'rotate(0deg)' }, { transform: v }] : [{ transform: 'rotate(0deg)' }, { transform: nd.dataset.deg != null ? 'rotate(180deg)' : 'rotate(360deg)', offset: .45 }, { transform: v }],
        { duration: seenCal ? 450 : 900, delay: gi * 40, easing: 'cubic-bezier(.34,1.22,.64,1)' });
    }
    const disc = svg.querySelector('.sol[data-r]');
    if (disc && !seenCal) { const k = 42 / disc.dataset.r; disc.style.transformBox = 'fill-box'; disc.style.transformOrigin = 'center'; disc.animate([{ transform: `scale(${9 / disc.dataset.r})` }, { transform: `scale(${k})`, offset: .45 }, { transform: 'scale(1)' }], { duration: 900, delay: gi * 40, easing: 'cubic-bezier(.34,1.22,.64,1)' }); }
    const ticks = svg.querySelectorAll('.tick');
    if (ticks.length && !seenCal) ticks.forEach((t, i) => t.animate([{ opacity: .2 }, { opacity: 1 }], { duration: 160, delay: 200 + i * 10, fill: 'backwards' }));
    const rise = svg.querySelector('.rise');
    if (rise) rise.animate([{ transform: 'translateY(24px)' }, { transform: rise.style.transform }], { duration: 560, delay: 120 + gi * 40, easing: 'cubic-bezier(.16,1,.3,1)' });
  });
}

/* ---------- µ4 odometer number change ---------- */
function odo(el, text) {
  text = String(text); const old = el.textContent;
  el.textContent = ''; el.classList.add('odo');
  [...text].forEach((ch, i) => {
    const sp = document.createElement('span'); sp.textContent = ch; el.appendChild(sp);
    if (!REDUCE.matches && old && old[i] !== ch) sp.animate([{ transform: 'translateY(7px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 200, delay: (text.length - 1 - i) * 20, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  });
}

/* ---------- toast with undo ---------- */
let tt;
function toast(label, msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span class="m">${esc(label)}</span><span class="b">${esc(msg)}</span>${undo ? '<button class="u" id="undo">Undo</button>' : ''}`;
  t.classList.add('show'); clearTimeout(tt);
  const hide = () => t.classList.remove('show');
  tt = setTimeout(hide, 4000);
  t.onmouseenter = () => clearTimeout(tt); t.onmouseleave = () => { tt = setTimeout(hide, 2000); };
  if (undo) $('#undo').onclick = () => { undo(); hide(); };
}
function togglePlan(id, silent) {
  const was = inPlan(id);
  if (was) plan = plan.filter(x => x !== id); else plan.push(id);
  savePlan();
  if (!silent) {
    if (was) toast('Plan', 'Removed', () => { if (!inPlan(id)) { plan.push(id); savePlan(); rerender(); } });
    else toast('Plan', 'Added');
  }
  return !was;
}
function updateBadge() { const b = $('#bdg'); b.hidden = !plan.length; }

/* ---------- press feedback: scale + (Night) halation bloom from the touch point ---------- */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.btn, .pm, .chip, .ins, .prow, .tabbar button');
  if (!el || getComputedStyle(document.documentElement).getPropertyValue('--aura-on').trim() !== '1' || REDUCE.matches) return;
  const r = el.getBoundingClientRect(), b = document.createElement('i'); b.className = 'pb';
  el.classList.add('bloomable'); b.style.setProperty('--px', (e.clientX - r.left) + 'px'); b.style.setProperty('--py', (e.clientY - r.top) + 'px');
  el.appendChild(b); setTimeout(() => b.remove(), 520);
}, { passive: true });

/* ---------- router + focus-pull transitions ---------- */
const view = $('#view');
const curHash = () => decodeURIComponent(location.hash.slice(1)) || 'home';
const TAB_OF = h => h.startsWith('ch-') || h.startsWith('p-') ? 'home' : h;
const depth = h => h.startsWith('p-') ? 2 : h.startsWith('ch-') ? 1 : 0;
let lastHash = curHash();
function go(h) { if (curHash() === h) rerender(); else location.hash = h; }
function setPal(p) { document.body.dataset.pal = p; }
function render() {
  const h = curHash();
  closeMenu(true);
  document.querySelectorAll('#tabbar button').forEach(b => { const on = b.dataset.go === TAB_OF(h); b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  moveLift();
  if (h.startsWith('ch-') && CH.find(c => c.key === h.slice(3))) renderChapter(CH.find(c => c.key === h.slice(3)));
  else if (h.startsWith('p-') && BY_ID[h.slice(2)]) renderProtocol(BY_ID[h.slice(2)]);
  else if (h === 'browse') renderBrowse();
  else if (h === 'plan') renderPlan();
  else if (h === 'about') renderAbout();
  else renderHome();
  onScroll();
}
function rerender() { const y = scrollY; render(); scrollTo(0, y); }
function moveLift() {
  const on = $('#tabbar button.on'); if (!on) return;
  $('#lc').style.setProperty('--x', (on.offsetLeft + on.offsetWidth / 2 - 24 - 8) + 'px');
}
addEventListener('resize', moveLift);
/* the new screen builds in, block by block, top to bottom (transform + opacity only) */
function enterTargets() {
  const out = [], named = el => el.style.viewTransitionName;
  const walk = el => { for (const c of el.children) {
    if (c.matches('.appbar') || named(c)) continue;
    if (c.querySelector('[style*="view-transition-name"]') || c.matches('.row2, .stack, .rows')) { walk(c); continue; }
    out.push(c);
  } };
  walk(view);
  const h = innerHeight;
  return out.filter(el => { const r = el.getBoundingClientRect(); return r.height && r.top < h; }).slice(0, 14);
}
function enter(nav) {
  if (REDUCE.matches) return;
  const dy = nav === 'pop' ? -10 : 14;
  enterTargets().forEach((el, i) => el.animate(
    [{ opacity: 0, transform: `translate3d(0,${dy}px,0)` }, { opacity: 1, transform: 'none' }],
    { duration: 520, delay: 70 + i * 38, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
}
function transition(update, nav) {
  const root = document.documentElement;
  if (document.startViewTransition && document.visibilityState === 'visible') {
    root.dataset.nav = nav;
    try { const t = document.startViewTransition(() => { update(); enter(nav); }); t.finished.finally(() => delete root.dataset.nav); }
    catch { delete root.dataset.nav; update(); }
    return;
  }
  update(); enter(nav);
}
addEventListener('hashchange', () => {
  const from = lastHash, to = curHash(), nav = depth(to) < depth(from) ? 'pop' : 'push'; lastHash = to;
  transition(() => { render(); scrollTo(0, 0); if (nav === 'pop') nameReturn(from); }, nav);
});
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
function onScroll() { document.body.classList.toggle('scrolled', scrollY > 8); }
addEventListener('scroll', onScroll, { passive: true });
function bar(title, lead, trail) {
  return `<header class="appbar">${lead || '<span></span>'}<div class="t">${esc(title)}</div>${trail || '<span></span>'}</header>`;
}
const backBtn = (h, label) => `<button class="ib" data-nav="${h}" aria-label="${esc(label)}">${I.back}</button>`;
function wireNav(root) { root.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { const g = b.dataset.morph && b.querySelector('.glyph'); if (g) g.style.viewTransitionName = b.dataset.morph; go(b.dataset.nav); })); }
/* after a pop, give the element we came back to its shared name so the morph runs in reverse */
function nameReturn(from) {
  if (from.startsWith('p-')) { const n = view.querySelector(`[data-open="${from.slice(2)}"] .n`); if (n) n.style.viewTransitionName = 'pn-' + from.slice(2); }
  if (from.startsWith('ch-')) { const g = view.querySelector(`[data-morph="ins-${from.slice(3)}"] .glyph`); if (g) g.style.viewTransitionName = 'ins-' + from.slice(3); }
}
function cascade(nodes) {
  if (REDUCE.matches) return;
  [...nodes].slice(0, 8).forEach((n, i) => n.animate([{ transform: 'translateY(8px)', opacity: .5 }, { transform: 'none', opacity: 1 }], { duration: 240, delay: i * 30, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
}

}
function wireRows(root, after) {
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-add]');
    if (a) { e.stopPropagation(); const on = togglePlan(a.dataset.add); a.classList.toggle('on', on); a.setAttribute('aria-pressed', on); a.setAttribute('aria-label', (on ? 'Remove from' : 'Add to') + ' plan'); after && after(); return; }
    const r = e.target.closest('[data-open]'); if (r) { const n = r.querySelector('.n'); if (n) n.style.viewTransitionName = 'pn-' + r.dataset.open; go('p-' + r.dataset.open); }

}
const vf = (msg, btn) => `<div class="vf"><p>${msg}</p>${btn || ''}</div>`;
const planKeys = () => {
  const keys = [];
  plan.forEach(id => { const p = BY_ID[id]; if (p.schedule.length) p.schedule.forEach((s, i) => keys.push('plan:' + id + ':s' + i)); else keys.push('plan:' + id + ':u'); });
  return keys;
};
const doneCount = () => planKeys().filter(k => done.ids[k]).length;

/* ---------- schedule maths (only from the book's stated windows) ---------- */
const toMin = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
function windowOf(s) {
  const base = toMin(s.anchor === 'bed' ? times.bed : times.wake);
  return { a: base + s.start_min, b: s.end_min == null ? null : base + s.end_min };
}
const relToWake = m => ((m - toMin(times.wake)) % 1440 + 1440) % 1440;
function isLive(w) {
  const now = new Date(), n = now.getHours() * 60 + now.getMinutes();
  if (w.b == null || w.b === w.a) return false;
  const a = ((w.a % 1440) + 1440) % 1440, len = w.b - w.a;
  return ((n - a + 1440) % 1440) < len;
}

        <div class="rows">${untimed.map(u => { const dn = !!done.ids[u.k];
          return `<button class="srow ${dn ? 'done' : ''}" data-k="${u.k}" aria-pressed="${dn}"><span class="ck">${dn ? I.check : ''}</span><span class="tx">${esc(u.p.title)}<span class="micro" style="display:block;margin-top:2px">${esc(u.p.ch.short)} ${pad(u.p.number)}</span></span></button>`; }).join('')}</div></section>` : ''}
      <section class="sec"><div class="sh"><h2>In your plan <span class="cnt">(${items.length})</span></h2></div><div class="rows" id="plist">${items.map(p => protoRow(p, true, true)).join('')}</div></section>
      <section class="sec"><div class="card"><span class="label">From the book · P.${DATA.disclaimer.page}</span><p class="body-s" style="margin:8px 0 0">${esc(DATA.disclaimer.text)}</p></div></section>`;
    body.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k, v = !done.ids[k]; setDone(k, v);
      b.classList.toggle('done', v); b.setAttribute('aria-pressed', v); b.querySelector('.ck').innerHTML = v ? I.check : '';
      const nd = b.querySelector('.nd'); if (nd && v) nd.innerHTML = '<i></i>';
      const dd = doneCount(); odo($('#pov'), dd + '/' + keys.length);
      if (dd === keys.length) { // µ9 success
        $('#porb').classList.add('lit', 'flash'); setTimeout(() => $('#porb') && $('#porb').classList.remove('flash'), 420);
        const hz = $('#hz'); hz.classList.remove('success'); void hz.offsetWidth; hz.classList.add('success');
        toast('Today', 'All done');
      } else $('#porb').classList.remove('lit');
    }));
    wireRows($('#plist'), () => setTimeout(rerender, 260));
  }
  wireNav(view);
  ['wake', 'bed'].forEach(id => $('#' + id).addEventListener('change', e => { if (!e.target.value) return; times[id] = e.target.value; store.set('times', times); toast(id === 'wake' ? 'Wake' : 'Bed', 'Set to ' + e.target.value); rerender(); }));
}

/* ================= ABOUT / SETTINGS ================= */
function renderAbout() {
  setPal('dusk');
  const mi = { auto: 0, fog: 1, night: 2 }[mode];
  view.innerHTML = `${bar('About')}
    <span class="aside" style="display:block;text-align:right;margin:4px -4px -18px 0">~For readers</span>
    <h1 class="title-xl">Field guide</h1><p class="title-m">A companion to <i>Protocols</i> by Andrew Huberman</p>
    <div class="statrow" style="margin-top:24px"><div><b>${CH.length}</b><span>Chapters</span></div><div><b>${ALL.length}</b><span>Protocols</span></div><div><b>${DATA.claims}</b><span>Checked points</span></div></div>
    <section class="sec"><div class="sh"><h2>Display</h2></div>
      <div class="group"><div class="setrow"><span class="body-l">Theme</span>
        <div class="seg" role="radiogroup" aria-label="Theme" style="--i:${mi}"><span class="th"></span>
          <button role="radio" data-m="auto" class="${mode === 'auto' ? 'on' : ''}" aria-checked="${mode === 'auto'}">Auto</button>
          <button role="radio" data-m="fog" class="${mode === 'fog' ? 'on' : ''}" aria-checked="${mode === 'fog'}">Fog</button>
          <button role="radio" data-m="night" class="${mode === 'night' ? 'on' : ''}" aria-checked="${mode === 'night'}">Night</button></div></div></div></section>
    <section class="sec"><div class="sh"><h2>Method</h2></div><div class="card prose">
      <p>Every point here is a short paraphrase of the book itself. Nothing comes from outside sources.</p>
      <p>Each point was checked against a specific passage. Page tags (like <span class="pg">P.31</span>) tell you where to find it in your PDF copy.</p>
      <p>Times in <b style="font-weight:500">Plan</b> appear only where the book gives a window relative to waking or bedtime.</p>
      <p>These are summaries of the book’s text. The book gives the full detail behind each protocol.</p></div></section>
    <section class="sec"><div class="sh"><h2>Disclaimer</h2><span class="pg">P.${DATA.disclaimer.page}</span></div><div class="card"><p class="body-s" style="margin:0">${esc(DATA.disclaimer.text)}</p></div></section>
    <section class="sec"><div class="sh"><h2>Chapters <span class="cnt">(${CH.length})</span></h2></div>
      <div class="group">${CH.map((c, i) => `<button class="mrow" style="border-radius:0;height:52px;padding:0 16px" data-nav="ch-${c.key}"><span class="micro" style="width:20px">${pad(i + 1)}</span>${esc(c.name)}<span class="cnt">(${c.protocols.length})</span></button>`).join('')}</div></section>
    <section class="sec"><div class="sh"><h2>Your data</h2></div>
      <div class="group"><div class="setrow"><span class="body-s" style="max-width:24ch">Your plan, ticks and times. Saved only in this browser.</span>
      <button class="btn" id="reset" style="height:44px;min-width:0;padding:0 18px;color:var(--crit)">Reset</button></div></div></section>`;
  wireNav(view);
  view.querySelectorAll('.seg [data-m]').forEach(b => b.addEventListener('click', () => {
    const m = b.dataset.m; if (m === mode) return; mode = m; store.set('mode', m);
    const seg = b.parentElement; seg.style.setProperty('--i', { auto: 0, fog: 1, night: 2 }[m]);
    seg.querySelectorAll('[data-m]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
    if (document.startViewTransition && !REDUCE.matches) { document.documentElement.dataset.nav = 'theme'; const t = document.startViewTransition(applyMode); t.finished.finally(() => delete document.documentElement.dataset.nav); }
    else applyMode();
  }));
  $('#reset').onclick = () => {
    const snap = { plan: [...plan], done: JSON.parse(JSON.stringify(done)) };
    plan = []; done = { day: today(), ids: {} }; store.set('done', done); savePlan();
    toast('Reset', 'Plan cleared', () => { plan = snap.plan; done = snap.done; store.set('done', done); savePlan(); });
  };
}

updateBadge();
render();
requestAnimationFrame(moveLift);
})();
</script>
