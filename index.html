<style>
/* HALATION — a monochrome instrument with light seeping through it.
   Layout: phone hub-and-spoke, one 2-column bento grid (M = module), floating glass capsule tab bar. */
:root {
  /* semantic roles — Fog (default) */
  --canvas: #D8DAD5; --ambient: #D8DAD5;
  --container: #E7E7E7; --container-high: #F0F0EE; --lift: #FAFAFA; --recessed: #CDD0CA;
  --sheet: #FAFAFA; --emphasis: #211C22; --orb: #211C22; --track: #CDD0CA; --thumb: #FAFAFA;
  --c1: #211C22; --c2: #5E5C61; --c3: #7B7A7F; --ink3: #A9A8AC;
  --on-emph: #FAFAFA; --on-sheet: #211C22; --on-sheet-2: #5E5C61;
  --sheet-cta: #211C22; --sheet-cta-text: #FAFAFA;
  --hair: rgba(33,28,34,.10); --struct: #211C22; --focus: #211C22; --state: 33,28,34;
  --glass: rgba(240,240,238,.62); --glass-edge-a: rgba(255,255,255,.55); --glass-edge-b: rgba(0,0,0,.06);
  --lift-shadow: 0 1px 2px rgba(33,28,34,.04), 0 6px 20px rgba(33,28,34,.06);
  --crit: #9E2632; --crit-glow: #B32F3C; --pos: #34594D; --unread: #ECABE6;
  --grain-op: .035; --grain-blend: normal; --aura-on: 0;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --serif: 'Instrument Serif', 'Newsreader', Georgia, serif;
  /* motion */
  --settle: cubic-bezier(.16,1,.3,1); --focus-ease: cubic-bezier(.33,0,.15,1); --exit: cubic-bezier(.5,0,.75,0);
  --breath: cubic-bezier(.45,0,.55,1); --instrument: cubic-bezier(.34,1.22,.64,1); --sheet-spring: cubic-bezier(.22,1.08,.36,1);
  --M: min(165px, calc((100vw - 48px - 12px) / 2));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-mode="fog"]) {
  --canvas: #161417; --ambient: #0B0A09; --container: #211C22; --container-high: #2C292D; --lift: #2C292D; --recessed: #0F0E10;
  --sheet: #E9E5DC; --emphasis: #302F30; --orb: #211C22; --track: #363636; --thumb: #5E5E5F;
  --c1: #F2EFEA; --c2: #9A9794; --c3: #6B6866; --ink3: #4A4749; --on-emph: #F2EFEA; --on-sheet: #211C22; --on-sheet-2: #625E5A;
  --sheet-cta: #302F30; --sheet-cta-text: #F2EFEA;
  --hair: rgba(242,239,234,.08); --struct: rgba(242,239,234,.70); --focus: #F2EFEA; --state: 242,239,234;
  --glass: rgba(33,28,34,.58); --glass-edge-a: rgba(255,255,255,.12); --glass-edge-b: rgba(0,0,0,.2);
  --lift-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 20px rgba(0,0,0,.25);
  --crit: #E07A84; --pos: #9CB6AE; --grain-op: .045; --grain-blend: normal; --aura-on: 1; color-scheme: dark;
} }
:root[data-theme="dark"]:not([data-mode="fog"]), :root[data-mode="night"] {
  --canvas: #161417; --ambient: #0B0A09; --container: #211C22; --container-high: #2C292D; --lift: #2C292D; --recessed: #0F0E10;
  --sheet: #E9E5DC; --emphasis: #302F30; --orb: #211C22; --track: #363636; --thumb: #5E5E5F;
  --c1: #F2EFEA; --c2: #9A9794; --c3: #6B6866; --ink3: #4A4749; --on-emph: #F2EFEA; --on-sheet: #211C22; --on-sheet-2: #625E5A;
  --sheet-cta: #302F30; --sheet-cta-text: #F2EFEA;
  --hair: rgba(242,239,234,.08); --struct: rgba(242,239,234,.70); --focus: #F2EFEA; --state: 242,239,234;
  --glass: rgba(33,28,34,.58); --glass-edge-a: rgba(255,255,255,.12); --glass-edge-b: rgba(0,0,0,.2);
  --lift-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 20px rgba(0,0,0,.25);
  --crit: #E07A84; --pos: #9CB6AE; --grain-op: .045; --grain-blend: normal; --aura-on: 1; color-scheme: dark;
}
:root[data-mode="fog"] { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--ambient); color: var(--c1); font: 400 15px/22px var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; font-feature-settings: "tnum", "lnum"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ambient); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* ---------- atmosphere (emissive layer) ---------- */
.aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--aura-on); transition: opacity .56s var(--breath); contain: strict; display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-mode="fog"]) .aura { display: block; } }
:root[data-theme="dark"]:not([data-mode="fog"]) .aura, :root[data-mode="night"] .aura { display: block; }
.aura .grad { position: absolute; inset: 0 0 25% 0; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.aura .veil { position: absolute; inset: 0; background: linear-gradient(rgba(11,10,9,.48), rgba(11,10,9,.62) 45%, #0B0A09 78%); }
.bk { position: absolute; border-radius: 50%; will-change: transform; transform: translate3d(0,0,0); }
.bk > i { position: absolute; inset: 0; border-radius: inherit; display: block; }
.bk1 { width: 70vw; max-width: 520px; aspect-ratio: 1; left: -18vw; top: 22vh; animation: driftx 29s var(--breath) infinite alternate; }
.bk2 { width: 54vw; max-width: 420px; aspect-ratio: 1; right: -14vw; top: -6vh; animation: driftx 37s var(--breath) infinite alternate-reverse; }
.bk3 { width: 34vw; max-width: 260px; aspect-ratio: 1; left: 34vw; top: 30vh; animation: driftx 23s var(--breath) infinite alternate; }
.bk > i { will-change: transform; animation: drifty 31s var(--breath) infinite alternate; }
.bk2 > i { animation-duration: 41s; }
.bk3 > i { animation-duration: 19s; }
@keyframes driftx { from { transform: translate3d(0,0,0); } to { transform: translate3d(8vw,0,0); } }
@keyframes drifty { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(0,6vh,0) scale(1.06); } }
/* DUSK — headlights in fog */
[data-pal="dusk"] .aura .grad { background: linear-gradient(180deg, #37636F 0%, #7C86A4 22%, #A090B4 40%, #B9BEAC 48%, #956098 56%, #6B2826 72%, #231D1F 88%, #0B0A09 100%); }
[data-pal="dusk"] .bk1 > i { background: radial-gradient(circle at 40% 55%, #AFD3C6 0 6%, #E87A32 18%, rgba(217,101,70,.55) 40%, transparent 68%); }
[data-pal="dusk"] .bk2 > i { background: radial-gradient(circle, rgba(124,134,164,.85), rgba(75,129,151,.4) 45%, transparent 70%); }
[data-pal="dusk"] .bk3 > i { background: radial-gradient(circle, rgba(188,115,148,.7), rgba(149,96,152,.3) 50%, transparent 72%); }
/* BLOOM — flowers out of focus */
[data-pal="bloom"] .aura .grad { background: radial-gradient(60% 50% at 25% 70%, rgba(200,107,153,.55), transparent 70%), radial-gradient(50% 45% at 80% 20%, rgba(121,141,161,.5), transparent 70%), #0B0802; }
[data-pal="bloom"] .bk1 > i { background: radial-gradient(circle at 45% 50%, #CF6708 0 5%, rgba(200,107,153,.85) 22%, rgba(189,81,41,.35) 46%, transparent 68%); }
[data-pal="bloom"] .bk2 > i { background: radial-gradient(circle, rgba(160,150,191,.8), rgba(26,113,164,.35) 50%, transparent 70%); }
[data-pal="bloom"] .bk3 > i { background: radial-gradient(circle, rgba(177,135,144,.75), rgba(125,90,163,.3) 50%, transparent 72%); }
.grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: var(--grain-url, none); background-size: 256px 256px; opacity: var(--grain-op); image-rendering: pixelated; contain: strict; }
.paused .bk, .paused .bk > i, .paused .live-dot::before, .paused .live-dot::after { animation-play-state: paused !important; }

/* ---------- FOG: Sage Frost "Leaf Pockets" (separate leaf-shaped pools of green on frost white) ---------- */
:root[data-mode="fog"], :root[data-theme="light"]:not([data-mode="night"]) { --canvas: #EDF1EA; --ambient: #EDF1EA; --container: rgba(255,255,255,.62); --container-high: rgba(255,255,255,.78); --recessed: rgba(255,255,255,.45); --track: rgba(255,255,255,.5); --glass: rgba(255,255,255,.55); --grain-op: .5; }
:root[data-mode="fog"] body, :root[data-theme="light"]:not([data-mode="night"]) body { background: #EDF1EA; }
:root[data-mode="fog"] .aura, :root[data-theme="light"]:not([data-mode="night"]) .aura { display: block; opacity: 1; }
:root[data-mode="fog"] .aura .grad, :root[data-theme="light"]:not([data-mode="night"]) .aura .grad, :root[data-mode="fog"] [data-pal] .aura .grad, :root[data-theme="light"]:not([data-mode="night"]) [data-pal] .aura .grad { inset: 0; -webkit-mask-image: none; mask-image: none; background: radial-gradient(9% 9% at 40% 86%, rgba(126,172,118,.7) 0 30%, transparent 70%), radial-gradient(7% 5% at 86% 36%, rgba(160,204,136,.6) 0 30%, transparent 70%), radial-gradient(30% 13.8% at 14% 36%, rgba(250,252,246,.9) 0 28%, transparent 62%), linear-gradient(180deg, #F1F4EE 0%, #F4F7F1 40%, #EEF2EA 100%); }
:root[data-mode="fog"] .aura .veil, :root[data-theme="light"]:not([data-mode="night"]) .aura .veil { background: none; }
:root[data-mode="fog"] .grain, :root[data-theme="light"]:not([data-mode="night"]) .grain { background-image: var(--grain-fog-url, var(--grain-url, none)); background-size: 128px 128px; image-rendering: auto; }
:root[data-mode="fog"] .bk1, :root[data-theme="light"]:not([data-mode="night"]) .bk1 { left:-6vw; top:40vh; width:26vw; aspect-ratio:0.34; rotate:-34deg; right: auto; max-width: none;  }
:root[data-mode="fog"] [data-pal] .bk1 > i, :root[data-theme="light"]:not([data-mode="night"]) [data-pal] .bk1 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(110,158,110,.85) 0 30%, transparent 70%); }
:root[data-mode="fog"] .bk2, :root[data-theme="light"]:not([data-mode="night"]) .bk2 { right:-4vw; top:6vh; width:22vw; aspect-ratio:0.36; rotate:28deg; left: auto; max-width: none;  }
:root[data-mode="fog"] [data-pal] .bk2 > i, :root[data-theme="light"]:not([data-mode="night"]) [data-pal] .bk2 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(170,212,140,.85) 0 30%, transparent 70%); }
:root[data-mode="fog"] .bk3, :root[data-theme="light"]:not([data-mode="night"]) .bk3 { left:58vw; top:58vh; width:20vw; aspect-ratio:0.34; rotate:18deg; right: auto; max-width: none;  }
:root[data-mode="fog"] [data-pal] .bk3 > i, :root[data-theme="light"]:not([data-mode="night"]) [data-pal] .bk3 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(136,184,122,.8) 0 30%, transparent 70%); }
@media (prefers-color-scheme: light) {
:root:not([data-mode="night"]):not([data-theme="dark"]) { --canvas: #EDF1EA; --ambient: #EDF1EA; --container: rgba(255,255,255,.62); --container-high: rgba(255,255,255,.78); --recessed: rgba(255,255,255,.45); --track: rgba(255,255,255,.5); --glass: rgba(255,255,255,.55); --grain-op: .5; }
:root:not([data-mode="night"]):not([data-theme="dark"]) body { background: #EDF1EA; }
:root:not([data-mode="night"]):not([data-theme="dark"]) .aura { display: block; opacity: 1; }
:root:not([data-mode="night"]):not([data-theme="dark"]) .aura .grad, :root:not([data-mode="night"]):not([data-theme="dark"]) [data-pal] .aura .grad { inset: 0; -webkit-mask-image: none; mask-image: none; background: radial-gradient(9% 9% at 40% 86%, rgba(126,172,118,.7) 0 30%, transparent 70%), radial-gradient(7% 5% at 86% 36%, rgba(160,204,136,.6) 0 30%, transparent 70%), radial-gradient(30% 13.8% at 14% 36%, rgba(250,252,246,.9) 0 28%, transparent 62%), linear-gradient(180deg, #F1F4EE 0%, #F4F7F1 40%, #EEF2EA 100%); }
:root:not([data-mode="night"]):not([data-theme="dark"]) .aura .veil { background: none; }
:root:not([data-mode="night"]):not([data-theme="dark"]) .grain { background-image: var(--grain-fog-url, var(--grain-url, none)); background-size: 128px 128px; image-rendering: auto; }
:root:not([data-mode="night"]):not([data-theme="dark"]) .bk1 { left:-6vw; top:40vh; width:26vw; aspect-ratio:0.34; rotate:-34deg; right: auto; max-width: none;  }
:root:not([data-mode="night"]):not([data-theme="dark"]) [data-pal] .bk1 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(110,158,110,.85) 0 30%, transparent 70%); }
:root:not([data-mode="night"]):not([data-theme="dark"]) .bk2 { right:-4vw; top:6vh; width:22vw; aspect-ratio:0.36; rotate:28deg; left: auto; max-width: none;  }
:root:not([data-mode="night"]):not([data-theme="dark"]) [data-pal] .bk2 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(170,212,140,.85) 0 30%, transparent 70%); }
:root:not([data-mode="night"]):not([data-theme="dark"]) .bk3 { left:58vw; top:58vh; width:20vw; aspect-ratio:0.34; rotate:18deg; right: auto; max-width: none;  }
:root:not([data-mode="night"]):not([data-theme="dark"]) [data-pal] .bk3 > i { background: radial-gradient(50% 50% at 50% 50%, rgba(136,184,122,.8) 0 30%, transparent 70%); }
}

/* ---------- frame ---------- */
#app { position: relative; z-index: 1; }
.page { max-width: 560px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-bottom: calc(64px + 16px + env(safe-area-inset-bottom, 0px) + 40px); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 56px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 0 -12px; padding: 0 0; transition: background-color .24s, box-shadow .24s; }
.appbar::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); z-index: -1; opacity: 0; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(115%); backdrop-filter: blur(20px) saturate(115%); box-shadow: inset 0 -1px 0 var(--hair); transition: opacity .24s var(--settle); }
.scrolled .appbar::before { opacity: 1; }
.appbar .t { text-align: center; font: 400 15px/20px var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--c1); transition: background-color 90ms, transform .12s; }
.ib svg { width: 24px; height: 24px; }
@media (hover: hover) { .ib:hover { background: rgba(var(--state), .04); } }
.ib:active { transform: scale(.94); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- type ---------- */
.title-xl { font: 400 34px/40px var(--sans); letter-spacing: -.015em; margin: 8px 0 0; text-wrap: balance; }
.title-l { font: 500 24px/30px var(--sans); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.title-m { font: 400 20px/26px var(--sans); letter-spacing: -.005em; color: var(--c2); margin: 4px 0 0; }
.label { font: 400 11px/14px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c2); }
.label-strong { font: 600 14px/18px var(--mono); letter-spacing: .03em; text-transform: uppercase; }
.label-value { font: 400 14px/18px var(--mono); letter-spacing: .02em; color: var(--c2); }
.micro { font: 500 9px/12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--c3); }
.readout { font: 300 26px/28px var(--mono); }
.caption { font: 400 11px/14px var(--sans); color: var(--c3); }
.body-s { font: 400 13px/18px var(--sans); color: var(--c2); }
.body-l { font: 400 17px/24px var(--sans); }
.aside { font: italic 400 26px/30px var(--serif); color: var(--c2); pointer-events: none; }
.pg { font: 500 9px/12px var(--mono); letter-spacing: .14em; color: var(--c3); white-space: nowrap; }
.sub { color: var(--c2); }

/* ---------- surfaces & components ---------- */
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.stack > * { min-width: 0; }
.horizon { position: relative; height: 1px; background: var(--struct); margin-top: 12px; }
.horizon .sweep { position: absolute; inset: -1px auto -1px 0; width: 40%; background: linear-gradient(90deg, transparent, #DB4C14, #ED800E, #E9B110, #5FC644, #13E4D8, #097FC0, transparent); filter: blur(1px); opacity: 0; }
.horizon.success .sweep { animation: sweep .6s var(--settle) forwards; }
@keyframes sweep { 0% { transform: translateX(-100%); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(250%); opacity: 0; } }

/* orb */
.orb { position: relative; z-index: 0; width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--orb); color: var(--on-emph); display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; }
.orb > * { position: relative; z-index: 1; }
.orb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 1px 1px 0 rgba(255,255,255,calc(.10 * var(--aura-on))); }
.orb .ol { font: 500 9px/12px var(--mono); letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.orb .ov { font: 300 48px/48px var(--mono); letter-spacing: -.02em; display: inline-flex; }
.orb .os { font: 400 13px/16px var(--mono); opacity: .8; }
.orb.lit::before, .halo::before { content: ""; position: absolute; inset: -18%; z-index: -1; border-radius: 50%; background: radial-gradient(circle, var(--hue, #E87A32) 0 18%, color-mix(in srgb, var(--hue, #E87A32) 45%, transparent) 42%, transparent 70%); opacity: calc(.24 + .26 * var(--aura-on)); animation: halo-in .56s var(--settle) both; }
@keyframes halo-in { from { opacity: 0; } }
.orb.flash { animation: jade .4s var(--settle); }
@keyframes jade { 50% { box-shadow: 0 0 0 2px #1ED08A, 0 0 32px 6px rgba(30,208,138,.55); } }

/* info pill */
.pill { position: relative; border-radius: 999px; background: var(--container); height: calc(var(--M) * .4606); min-height: 64px; padding: 0 22px; display: grid; align-content: center; gap: 2px; overflow: hidden; }
.pill .pl { display: flex; align-items: baseline; gap: 12px; }
.pill input[type="time"] { border: 0; background: none; padding: 0; margin: 0; font: 400 14px/18px var(--mono); letter-spacing: .02em; color: var(--c2); width: 100%; min-width: 0; cursor: pointer; }
.pill:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
.pill input[type="time"]:focus { outline: none; color: var(--c1); }
.pill input[type="time"]::-webkit-calendar-picker-indicator { opacity: .4; margin-left: 2px; }

/* instrument card */
.ins { position: relative; isolation: isolate; border-radius: 20px; background: var(--container); padding: 16px; aspect-ratio: 1; display: grid; grid-template-rows: auto 1fr auto; text-align: left; color: var(--c1); overflow: hidden; }
.ins.hung { border-top-left-radius: 0; border-top-right-radius: 0; }
.ins .glyph { display: grid; place-items: center; min-height: 0; }
.ins .glyph svg { width: min(88px, 62%); height: auto; max-height: 100%; overflow: visible; }
.ins .ro { display: flex; align-items: baseline; gap: 4px; }
.ins .ro .micro { color: var(--c2); }
.ins .st { margin-top: 2px; }
.ins .chev { position: absolute; right: 14px; top: 14px; width: 16px; height: 16px; color: var(--c3); }
.g { color: var(--c1); }
.g .ln { fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; }
.g .ln2 { fill: none; stroke: var(--ink3); stroke-width: 1; stroke-linecap: round; }
.g .sol { fill: currentColor; }
.g .needle { transition: transform .45s var(--instrument); transform-origin: 60px 80px; }
.g .tick { transition: stroke .2s, stroke-width .2s; }

/* list rows */
.rows { border-radius: 20px; background: var(--container); overflow: hidden; }
.prow { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr) 44px; gap: 12px; align-items: start; width: 100%; text-align: left; padding: 14px 8px 14px 16px; cursor: pointer; transition: background-color 90ms; }
.prow + .prow::before, .srow + .srow::before, .tlrow + .tlrow::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: linear-gradient(90deg, transparent, var(--hair) 15%, var(--hair) 85%, transparent); }
@media (hover: hover) { .prow:hover { background: rgba(var(--state), .04); } }
.prow:active { background: rgba(var(--state), .10); }
.prow .n { font: 400 13px/24px var(--mono); color: var(--c3); }
.prow .tt { font: 400 17px/24px var(--sans); }
.prow .ss { font: 400 13px/18px var(--sans); color: var(--c2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prow .mt { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

<script>
const DATA = {"chapters":[{"key":"sleep","name":"Sleep","short":"Sleep","color":"#344ea8","ink":"#ffffff","intro":{"text":"Sleep is the foundation of your mental health, physical health and performance. Aim to sleep well on 90–95% of nights. Here's the good news: whatever your chronotype, you can fix how long you sleep, how well you sleep and when you sleep. The protocols below run in order of importance.","pages":[26,28,30]},"protocols":[{"id":"sleep-01","number":1,"title":"View Sunlight as Soon as Possible After Waking","page":31,"summary":{"text":"Get daylight into your eyes outdoors as soon as you can after waking. It powerfully shapes your mood, focus and alertness during the day—and it improves your sleep.","pages":[31,32]},"why":[{"text":"Morning sunlight activates light-sensing cells in your eyes that talk to your master body clock (the SCN). That kicks off many helpful processes for the day ahead.","pages":[40]},{"text":"It shuts off leftover melatonin—the main hormone that makes you sleepy.","pages":[42]},{"text":"Short on sleep? Morning light helps clear leftover adenosine (a sleepiness chemical). That raises your alertness and keeps your clock from drifting later.","pages":[42]},{"text":"It can amplify your healthy morning cortisol rise by as much as 50%. It also helps keep that peak early in the day rather than in the afternoon.","pages":[44]}],"steps":[{"text":"Get outside each morning and look toward the sun—at least 5–10 minutes.","pages":[31]},{"text":"Aim for sunlight in your eyes within 30–60 minutes of waking up.","pages":[31]},{"text":"Face the sun with nothing in the way (awnings, buildings). Skip brimmed hats and sunglasses. Regular glasses or contacts? Those are fine.","pages":[31]},{"text":"Get outside. Viewing through a window or windshield is far less effective—though it's better than nothing.","pages":[47]},{"text":"Cloudy day? Stay out longer: at least 15 minutes when it's cloudy, and a minimum of 30 minutes when it's densely overcast.","pages":[46]},{"text":"Up before sunrise? Turn on as many bright indoor lights as you can, then head outside once the sun is up.","pages":[45]},{"text":"If you wake before sunrise every day or live where winters are very dark, you may want a 10,000 lux light for your mornings.","pages":[45]}],"numbers":[{"text":"That's the minimum outdoors on a sunny, clear morning.","pages":[31,46],"label":"Clear-day time","value":"At least 5–10 minutes"},{"text":"Your target window for getting sunlight in your eyes.","pages":[31],"label":"When","value":"Within 30–60 minutes of waking"},{"text":"When it's cloudy, stay out longer.","pages":[46],"label":"Cloudy days","value":"At least 15 minutes"},{"text":"Densely overcast? Extend your viewing even further.","pages":[46],"label":"Dense overcast","value":"30 minutes minimum"},{"text":"An option if you wake before sunrise daily or your winters are very dark.","pages":[45],"label":"Light box","value":"10,000 lux"}],"cautions":[{"text":"Caution: never stare at the sun or force your eyes open. Let yourself squint and blink, and if it's too bright, look a few degrees to the side.","pages":[32]},{"text":"Have macular degeneration or another eye condition? Be especially careful with midday sun, and if you're very light-sensitive, you may want to see your ophthalmologist first.","pages":[47]},{"text":"Skip sunglasses and transition lenses while viewing morning sunlight—they block the relevant wavelengths. At other times, they're fine for comfort and safety.","pages":[47]},{"text":"Missed a day? Don't despair. Your energy may be lower that day, but your rhythm reflects your previous 3–4 days of sunlight viewing.","pages":[46]}],"tags":[{"text":"light"},{"text":"timing"}],"when":[{"text":"morning"}],"schedule":[{"text":"Get morning sunlight in your eyes","pages":[31],"anchor":"wake","start_min":0,"end_min":60}]},{"id":"sleep-02","number":2,"title":"View Sunlight in the Late Afternoon","page":49,"summary":{"text":"In the late afternoon or early evening, get sunlight in your eyes. Paired with morning light, it keeps your sleep-wake schedule regular—and it partly buffers you against the effects of artificial light at night.","pages":[49,50]},"why":[{"text":"Here's the logic: morning light shifts your clock so you want to sleep and wake earlier, while late-day light shifts it later. Together, the two effects offset each other.","pages":[50]},{"text":"Afternoon sunlight makes your retinas less sensitive. In other words, artificial light after dark then disrupts your melatonin less.","pages":[52]},{"text":"The point is that after sundown, it takes very little bright light to quash melatonin and shift your clock. Studies show as little as 15 seconds can significantly shift it.","pages":[50,51]}],"steps":[{"text":"Ideally, get outside for at least 10–15 minutes before the sun sets.","pages":[49]},{"text":"Face west—or walk that way—toward the sun, if at all possible. You don't need to watch it set; that's a bonus.","pages":[49]},{"text":"Face the sun directly—no window, no windshield, no sunglasses, no brimmed hat.","pages":[49]},{"text":"Overcast day? Do it anyway—it's especially important then.","pages":[49]},{"text":"Can't catch the sunset? Try to step outside sometime in the afternoon for ambient daylight before dark—even a short stroll or a few moments on a balcony.","pages":[52]},{"text":"Still aim to dim the lights in the evening, and keep things as dark as possible while you sleep.","pages":[52]}],"numbers":[{"text":"The ideal time outside before the sun goes down.","pages":[49],"label":"Duration","value":"At least 10–15 minutes"},{"text":"Studies show that's enough bright light to significantly shift your circadian clock.","pages":[51],"label":"Clock-shifting light","value":"As little as 15 seconds"},{"text":"Firelight and moonlight? Not too bright to view after dark.","pages":[51],"label":"Candlelight","value":"Typically just 1 lux"},{"text":"Typical table lamp brightness—compare that with candlelight.","pages":[51],"label":"Table lamp","value":"200 to 400 lux"},{"text":"What common overhead indoor LED lighting puts out.","pages":[51],"label":"Overhead LED","value":"500 to 1,000 lux"}],"cautions":[{"text":"Don't rely on it alone. It only partly protects against nighttime screens and lights—it doesn't replace dimming lights at night.","pages":[52]},{"text":"If you spend your mornings and days mostly under artificial indoor light, nighttime artificial light has an outsized negative effect on your sleep. That makes this protocol especially important.","pages":[52]}],"tags":[{"text":"light"},{"text":"timing"}],"when":[{"text":"afternoon"},{"text":"evening"}],"schedule":[]},{"id":"sleep-03","number":3,"title":"Avoid Viewing Bright Lights in the Final Hour Before Bedtime","page":53,"summary":{"text":"After sundown, limit your light exposure: dim the lights, use red or amber light, wear light-blocking glasses or use candlelight. This helps keep cortisol low and melatonin elevated before sleep.","pages":[53]},"why":[{"text":"Most indoor lighting is now LED. The catch: LEDs emit a disproportionate amount of short-wavelength light, which can potently reduce melatonin.","pages":[55]},{"text":"Animal studies and emerging human evidence show bright light at night activates the perihabenula. The result? Higher cortisol, less dopamine, next-day anxiety and learning deficits—apparently separate from lost sleep.","pages":[56]},{"text":"The beauty of amber or red light: it causes less cortisol spiking and melatonin suppression than many bright white LEDs.","pages":[53]},{"text":"Bulb type matters, too. In a 2020 study, incandescent lighting interfered with melatonin production far less often than LED or fluorescent lights.","pages":[57]}],"steps":[{"text":"Option 1: Once the sun is down, dim the lights wherever you are for the hours before sleep.","pages":[53]},{"text":"Option 2: After dark, switch your indoor lighting to soft amber or red lights (incandescent or LED).","pages":[53]},{"text":"Option 3: On screens at night, or can't control the lighting (say, at a restaurant or airport)? Consider blue- and green-light-blocking glasses.","pages":[54]},{"text":"Option 4: Use candlelight—and blow it out before you go to sleep.","pages":[55]},{"text":"Estimate your temperature minimum: average wake time over 3–4 days, minus 2 hours. Strive to avoid bright artificial light for 6 hours before it (also given as 4–6 or 6–8 hours).","pages":[56,57]},{"text":"Whatever bulbs you use, dim them before bed anyway.","pages":[57]},{"text":"Up with an infant at night? Keep the lights as dim as possible and/or use red light bulbs.","pages":[59]}],"numbers":[{"text":"Also given as roughly 2 hours before your usual wake time—you don't need to measure it.","pages":[56],"label":"Temp minimum","value":"About 2–3 h before waking"},{"text":"That's the simple rule to avoid activating the habenula and shifting your circadian clock.","pages":[56],"label":"Avoid bright light","value":"4–6 h before temp minimum"},{"text":"Also given as the window to avoid bright lights at night and keep it dark.","pages":[56,57],"label":"Keep it dark","value":"6–8 h before temp minimum"},{"text":"Average your wake time over 3–4 days, subtract 2 hours, then strive to avoid bright light for the 6 hours before that.","pages":[57],"label":"Exact method","value":"Full 6 h before temp minimum"},{"text":"If you wake 6–8 a.m. and want to sleep 10 p.m.–midnight, this is your window. Dimming from 8–9 p.m. is even better.","pages":[56],"label":"Example window","value":"Avoid 11 p.m.–4 a.m."}],"cautions":[{"text":"Caution: never wear light-blocking glasses while driving. You may not see road signs and lights accurately, or at all, and you could have an accident.","pages":[58]},{"text":"This doesn't mean red-light therapy panels. They tend to be very bright—the opposite of what you want at night.","pages":[54]},{"text":"Be careful: LED or incandescent, if a light is bright enough, it will alter your circadian cycle.","pages":[58]},{"text":"From a circadian perspective, an occasional bright night out won't destroy your sleep. Aim for great sleep about 90% of nights—it's heavy nightly screen light that takes a toll.","pages":[58]}],"tags":[{"text":"light"},{"text":"environment"}],"when":[{"text":"evening"},{"text":"bedtime"}],"schedule":[{"text":"Avoid bright lights","pages":[53],"anchor":"bed","start_min":-60,"end_min":0},{"text":"Strive to avoid bright light (6-h method)","pages":[57],"anchor":"wake","start_min":-480,"end_min":-120}]},{"id":"sleep-04","number":4,"title":"Find Your Ideal To-Sleep and Wake-Up Times and Strive to Adhere to Them","page":60,"summary":{"text":"Work out your chronotype with a simple bedtime experiment, then stick to a consistent sleep-wake schedule. Even shifting a little closer to your chronotype gives you much more restorative sleep.","pages":[60]},"why":[{"text":"Sleep in sync with your chronotype and you get more growth hormone release, less light sleep, and more deep and REM sleep. So you tend to need less sleep overall.","pages":[70]},{"text":"Growth hormone is released in the first hours of sleep. That's why, if you're meant to sleep early but stay up late, you miss some of it.","pages":[63]},{"text":"You benefit from consistency with any sleep-wake schedule. Put simply, your body clock thrives on it.","pages":[65,72]},{"text":"Working at night and sleeping by day is linked to greatly elevated risk of depression, suicide, type 2 diabetes and cardiovascular disease.","pages":[70]}],"steps":[{"text":"Unless you're perfectly happy with your sleep, try one week of getting into bed by 8:30–9:00 p.m., lights out by 9:00–9:30 (10:00 p.m. at the latest, maybe).","pages":[62]},{"text":"If you're not ready for sleep yet, read a book or do another non-screen activity.","pages":[62]},{"text":"If you wake to use the bathroom, don't check the clock or turn on bright lights.","pages":[63]},{"text":"Eat your last bite at least 2–3 hours before bed. Gnawing hunger near bedtime? A small snack one hour before helps.","pages":[63]},{"text":"Try to make 1:00 or 2:00 p.m. your caffeine cutoff.","pages":[63]},{"text":"Go to bed and wake up at the same time—plus or minus 30 minutes—six to seven nights a week.","pages":[65]},{"text":"Had a late night? Sleep at most 1–2 hours past your usual wake time, try a 20-minute afternoon nap or NSDR, then get to bed around your usual time.","pages":[72]}],"numbers":[{"text":"Pick any sleep-wake schedule that works for you, as long as you get this much.","pages":[60],"label":"Sleep amount","value":"At least 6–8 hours"},{"text":"Keep the same bedtime and wake time within this margin.","pages":[65],"label":"Consistency","value":"±30 minutes, 6–7 nights/week"},{"text":"A small snack one hour before is OK if gnawing hunger hits.","pages":[63],"label":"Last meal","value":"At least 2–3 hours before bed"},{"text":"Try not to drink caffeine past this point.","pages":[63],"label":"Caffeine cutoff","value":"1:00 or 2:00 p.m."},{"text":"Feeling very awake then is normal—and it passes.","pages":[65],"label":"Wake maintenance zone","value":"1–3 hours before bedtime"}],"cautions":[{"text":"Don't eat too close to bedtime or have late-day caffeine. Either one leads to more frequent night wakings and will spoil the experiment.","pages":[63]},{"text":"Still can't fall asleep early after several nights? True night owls exist: your natural sleep window may fall between 10:30 p.m. and midnight.","pages":[63]},{"text":"Strive, don't strain. Trying to force sleep is the worst thing you can do.","pages":[65]},{"text":"In one study, counting sheep made it harder to fall asleep. Try a mental walk instead: picture walking from your bed to the mailbox, down the street and back home.","pages":[74]}],"tags":[{"text":"timing"}],"when":[{"text":"bedtime"}],"schedule":[{"text":"Last bite: at least 2–3 h before bed","pages":[63],"anchor":"bed","start_min":-180,"end_min":-120},{"text":"Feeling very awake is normal—let it pass","pages":[65],"anchor":"bed","start_min":-180,"end_min":-60}]},{"id":"sleep-05","number":5,"title":"Lower Your Core Body Temperature at Night","page":76,"summary":{"text":"Keep your bedroom cool and help your body shed heat at night. That's because a drop in core body temperature helps you fall asleep.","pages":[76,77]},"why":[{"text":"Falling asleep is preceded by a decline in body temperature. In fact, your core temperature needs to drop about 1–2 degrees for you to fall asleep.","pages":[77]},{"text":"Warming your skin with a hot shower, bath or sauna triggers your brain's thermostat to lower your core temperature. That makes it easier to fall asleep.","pages":[78]},{"text":"The skin of your hands and feet is a primary way you shed heat. So letting cool air reach them ranks among the most effective ways to cool your core.","pages":[76]},{"text":"And melatonin, which helps you fall asleep, is released in step with that nightly drop in body temperature.","pages":[77]}],"steps":[{"text":"Keep your bedroom between 65 and 68°F—and no higher than 70°F.","pages":[76]},{"text":"Warm your hands and feet before bed with a hot shower, hot bath or sauna—or even just by washing your face with very warm water.","pages":[76]},{"text":"Make sure your hands and feet can easily poke out from the covers. Untuck the sheets at the foot and sides of the bed.","pages":[76]},{"text":"Skip socks in bed—especially if you're prone to waking in the middle of the night.","pages":[76]},{"text":"Try a few bedding setups—warm blankets in a cool room, or just a sheet—and go with what suits you best.","pages":[78]},{"text":"Consider programmable room temperature controls: cooler at the start of the night, warmer toward morning.","pages":[78]},{"text":"Consistently struggle to sleep after hard evening workouts? Consider shifting your intense training to the morning and keeping evening sessions lighter.","pages":[79]}],"numbers":[{"text":"The protocol's target for your bedroom.","pages":[76],"label":"Bedroom target","value":"65–68°F, maximum 70°F"},{"text":"The ideal ambient temperature during sleep, according to research cited in the book.","pages":[77],"label":"Research finding","value":"Approximately 66–70°F"},{"text":"That's how far your core temperature needs to fall for sleep.","pages":[77],"label":"Core drop","value":"About 1–2 degrees"},{"text":"Best avoided: high-intensity exercise raises your core body temperature, which works against falling asleep.","pages":[79],"label":"Intense exercise","value":"Avoid within 3–4 h of sleep"}],"cautions":[{"text":"It's best to avoid intense exercise within 3–4 hours of sleep. Hard training raises core temperature, and that works against falling asleep.","pages":[79]},{"text":"Night your only time to exercise? Then getting the workout in matters more than skipping it. Afterward, a hot shower, breathing, dim light and no screens can help.","pages":[79]},{"text":"Run very cold at night? You may want to skip the no-socks advice.","pages":[76]}],"tags":[{"text":"temperature"},{"text":"environment"}],"when":[{"text":"bedtime"}],"schedule":[{"text":"Best to skip intense exercise (3–4 h)","pages":[79],"anchor":"bed","start_min":-240,"end_min":0}]},{"id":"sleep-06","number":6,"title":"Increase Your Core Body Temperature in the Final One to Two Hours of Sleep Before You Wake Up","page":80,"summary":{"text":"Warm up your body or your bedroom in the final 1–2 hours of sleep. Doing so can increase REM sleep and help you wake feeling refreshed and energized.","pages":[80]},"why":[{"text":"Your body temperature bottoms out about 2 hours before waking, then rises. It stands to reason that supporting this warm-up helps you wake energized.","pages":[81]},{"text":"Raising your core temperature late in the night increases how much REM sleep you get.","pages":[80]},{"text":"Hate leaving a warm bed for a cold room? A heating timer that warms the room 1–2 hours before waking solves that problem.","pages":[81]}],"steps":[{"text":"If your heating can be timed, program it to rise 1–3 degrees above your room temperature, starting 1–2 hours before you wake.","pages":[80]},{"text":"Keep clothing by your bed. Wake 1–2 hours early or to use the bathroom? Try pulling on socks, sweats or a knit cap, then go back to sleep.","pages":[80]},{"text":"No timer? Adjust your bedroom temperature and/or use clothes to warm up.","pages":[81]}],"numbers":[{"text":"That's how far to turn up the heat.","pages":[80],"label":"Room warm-up","value":"1–3 degrees above room temperature"},{"text":"When to start the warm-up.","pages":[80],"label":"Start time","value":"1–2 hours before wake-up"},{"text":"Your lowest body temperature—it rises after this. Sleep Protocol 3 puts it at about 2–3 hours.","pages":[56,81],"label":"Temp minimum","value":"About 2 hours before waking"}],"cautions":[{"text":"Be aware: there's less data on using temperature in this part of the sleep cycle than on cooling at night.","pages":[81]},{"text":"Be careful with heat: hot temperatures disrupt falling and staying asleep, and even after several days, the body tends not to adapt.","pages":[81]}],"tags":[{"text":"temperature"},{"text":"environment"}],"when":[{"text":"morning"}],"schedule":[{"text":"Warm room 1–3 degrees, starting 1–2 h before","pages":[80],"anchor":"wake","start_min":-120,"end_min":0}]},{"id":"sleep-07","number":7,"title":"Nap (Correctly) to Offset Minor Sleep Deficits","page":82,"summary":{"text":"Need a nap? Keep it short, and not so late that it hurts your nighttime sleep. Match nap length to your goal—and if you struggle to fall asleep at night, consider other forms of rest.","pages":[82,83]},"why":[{"text":"Napping can boost focus and learning. In one study, non-nappers' learning capacity declined, while a 90-minute nap group sustained or improved theirs.","pages":[84]},{"text":"Even a 20-minute nap reaches N2 sleep. That's where sleep spindles help process new learning and prepare your brain to take in more.","pages":[84]},{"text":"A 45–90 minute nap clears a substantial amount of adenosine. The catch: that's the sleep pressure you need to fall and stay asleep at night.","pages":[86]},{"text":"Cap a nap at about 20 minutes and you get N1 and N2 sleep's benefits without the grogginess (sleep inertia).","pages":[86]}],"steps":[{"text":"Keep naps to no more than about 20 minutes, and avoid anything longer than 90 minutes.","pages":[82]},{"text":"Want an energy boost that lasts the rest of the day? Aim for 15–20 minutes. A 5–10 minute nap gives a mild boost that doesn't last long.","pages":[82]},{"text":"If you're dealing with heavy emotions, go for a longer nap—but cap it at 90 minutes.","pages":[82]},{"text":"If you're sleep-deprived, a 30-, 60- or even 90-minute nap is fine. Just don't go longer.","pages":[83]},{"text":"Set an alarm for 15–20 minutes. Not refreshed? Perhaps hit the 5-minute snooze once—but not a second time.","pages":[86]},{"text":"Experiment to find what's \"too late\" for you. Notice whether you feel groggy afterward and whether you can still fall asleep easily at your usual bedtime.","pages":[82]},{"text":"Consider non-sleep rest instead: NSDR (Protocol 8), or lying down with your feet elevated and eyes closed for 10–15 minutes—no phone.","pages":[83,86]}],"numbers":[{"text":"Your default nap length.","pages":[82],"label":"Typical nap","value":"No more than about 20 minutes"},{"text":"Enough to lift concentration, mood and energy for the rest of the day.","pages":[82],"label":"Energy boost","value":"15–20 minutes"},{"text":"Don't nap past this.","pages":[82],"label":"Upper limit","value":"90 minutes"},{"text":"That's why a nap of about 45 minutes can leave you groggy.","pages":[82],"label":"REM arrives","value":"About 60–70 minutes in"},{"text":"Lie down with feet elevated and eyes closed.","pages":[86],"label":"Rest alternative","value":"10–15 minutes"}],"cautions":[{"text":"Trouble falling asleep at night? Then don't nap. People with insomnia should generally avoid naps.","pages":[86,87]},{"text":"Caution: naps longer than 90 minutes can alter your circadian rhythm and can often \"split\" your night sleep into two chunks.","pages":[83]},{"text":"If you have chronic insomnia and this book's protocols don't solve it, talk to a doctor who specializes in sleep medicine.","pages":[87]},{"text":"If you're not tired during the day, don't force a nap.","pages":[87]}],"tags":[{"text":"rest"},{"text":"timing"}],"when":[{"text":"daytime"},{"text":"as-needed"}],"schedule":[]},{"id":"sleep-08","number":8,"title":"Use Non-Sleep Deep Rest (NSDR) to Offset Sleep Deficits (and to Get Better at Falling and Staying Asleep at Night)","page":88,"summary":{"text":"NSDR is a free, self-directed relaxation practice: you stay awake while bringing your body into deep relaxation. Use it to restore your vigor when you're tired, and to help you fall asleep or fall back asleep.","pages":[88,89]},"why":[{"text":"Deliberately longer exhales shift your nervous system into a more relaxed, parasympathetic state. Put simply, your breath helps you downshift.","pages":[89]},{"text":"Moving your attention through your body, and away from it, while deeply relaxed creates a dreamlike state—yet you stay fully aware.","pages":[89]},{"text":"A small 2002 study found yoga nidra (the practice NSDR is based on) dramatically raised dopamine in the basal ganglia. Yoga nidra also lowered blood pressure and heart rate.","pages":[90]},{"text":"In a study of people with chronic insomnia, 20 minutes of yoga nidra twice a day helped them fall asleep—and fall back asleep—faster, and it reduced cortisol.","pages":[93]}],"steps":[{"text":"Tired and need to restore mental and physical vigor? Do NSDR—it takes as little as 10 minutes.","pages":[88]},{"text":"If you didn't sleep enough, do NSDR first thing in the morning. No time then? Do it midmorning or in the afternoon.","pages":[88]},{"text":"At night, if you can't fall asleep—or you wake and can't fall back asleep—do NSDR instead of tossing and turning.","pages":[88]},{"text":"Follow a free guided NSDR recording. Short (10-minute), medium (20-minute) and long (30-minute) versions are available.","pages":[88,91]},{"text":"If you do NSDR during the day or first thing in the morning, set an alarm—just in case you fall asleep.","pages":[92]},{"text":"Use about 10 minutes for a quick afternoon reset, or 20–30 minutes if you have the time. After a poor night, a longer session may help more.","pages":[92]}],"numbers":[{"text":"That's often enough for a quick afternoon reset.","pages":[88],"label":"Minimum","value":"As little as 10 minutes"},{"text":"These can be even more effective.","pages":[88],"label":"Longer sessions","value":"20, 30, or even 60 minutes"},{"text":"Huberman's suggestion when you have the time.","pages":[92],"label":"Suggested","value":"20–30 minutes if time allows"},{"text":"The yoga nidra schedule used in a study of 41 people with chronic insomnia.","pages":[93],"label":"Insomnia study","value":"20 minutes, twice daily"}],"cautions":[{"text":"NSDR won't necessarily cut how much sleep you need. Huberman isn't aware of much lab data behind claims that it replaces hours of sleep.","pages":[92]},{"text":"It's nearly impossible to do NSDR wrong—unless you're texting in the middle of a session.","pages":[88]},{"text":"Fall asleep during NSDR? That's fine. Daytime sleep then tends to be shallow, with little or no grogginess.","pages":[92]},{"text":"NSDR is not traditional meditation, breathwork or a nap. The key is staying awake while deeply relaxed.","pages":[89]}],"tags":[{"text":"rest"},{"text":"breathing"}],"when":[{"text":"morning"},{"text":"as-needed"}],"schedule":[]},{"id":"sleep-09","number":9,"title":"Consider Supplements to Support Sleep","page":94,"summary":{"text":"Several over-the-counter supplements can assist sleep. The key is the order: ideally, try behavioral tools first, check with your physician, then test supplements one at a time to find what works for you.","pages":[94,95]},"why":[{"text":"In a randomized study against placebo, magnesium L-threonate did double duty—it improved sleep quality and also cognitive performance during the day.","pages":[96]},{"text":"Apigenin, a flavonoid (plant chemical) in chamomile, is backed by a growing body of evidence as a sleep aid. Animal studies found a mild sedative effect.","pages":[97]},{"text":"Research suggests glycine works in a couple of ways: it raises serotonin, which helps regulate sleep, and it activates NMDA receptors in the SCN (home of your circadian clock).","pages":[97]},{"text":"GABA is an amino acid associated with quieting brain activity. In other words, it promotes relaxation—and that makes it conducive to sleep.","pages":[97]}],"steps":[{"text":"Ideally, start with behavioral tools. No pill can make up for poor sleep habits.","pages":[94]},{"text":"Check with your physician to confirm any supplement is safe for you and won't clash with medications you take.","pages":[94]},{"text":"Build your stack slowly. Try one compound at a time for a few nights each, start at the lowest listed amount, then add another supplement.","pages":[95]},{"text":"Starting with a small stack? Here's one that has worked for many people: 145–250 mg magnesium L-threonate (or bisglycinate), 50 mg apigenin, 100–200 mg theanine, about 30 minutes before sleep.","pages":[95]},{"text":"Know the other common over-the-counter options (doses are averages): glycine 1–2 g, myoinositol 900 mg, kiwi extract 500–1,000 mg, tart cherry extract 500 mg, saffron 30 mg, valerian 50–75 mg.","pages":[94,95]},{"text":"Time it right: take sleep supplements roughly thirty minutes before you plan to be asleep. Using magnesium for sleep? Take it before bed.","pages":[98]},{"text":"Buy only from reputable sources, and look for third-party testing—from NSF or US Pharmacopeia (USP), for example.","pages":[96,99]}],"numbers":[{"text":"Use L-threonate or bisglycinate—for sleep, the two forms are interchangeable.","pages":[94],"label":"Magnesium","value":"145–250 mg"},{"text":"Derived from chamomile.","pages":[94],"label":"Apigenin","value":"50 mg"},{"text":"The listed dose. Remember, the book's dosages are averages.","pages":[94,95],"label":"Theanine","value":"100–200 mg"},{"text":"Listed dose; all the book's dosages are averages.","pages":[94,95],"label":"GABA","value":"250–500 mg"},{"text":"Huberman suggests no more than this. Studies suggest it may benefit older adults; for other groups, the book notes no clear evidence of benefit.","pages":[95,97,98],"label":"Melatonin","value":"0.5–1.5 mg"}],"cautions":[{"text":"Prone to intense dreams or nightmares, or to sleepwalking? Skip theanine—it can make dreams more vivid.","pages":[95]},{"text":"Watch your gut. In Huberman's experience, about 5 percent of people get gut discomfort from magnesium threonate. If it persists, stop the magnesium.","pages":[95]},{"text":"Caution: the common melatonin doses of 3, 5 or 8–10 mg are incredibly high and not advised. Chronic use can be problematic—especially for children and adolescents.","pages":[97,98]},{"text":"Talk to your doctor before you start: supplements may react badly with prescribed medications, and sleep issues may signal an underlying health problem. Also, label doses often don't match the pills.","pages":[96]}],"tags":[{"text":"supplements"}],"when":[{"text":"bedtime"}],"schedule":[{"text":"Take sleep supplements now (~30 min before)","pages":[98],"anchor":"bed","start_min":-30,"end_min":-30}]},{"id":"sleep-10","number":10,"title":"Approach Prescription Sleep Drugs with Caution","page":100,"summary":{"text":"Tried the other sleep and stress-management protocols and still struggling? Talk to your doctor. Avoid prescription sleep aids if you can, and use them only if prescribed as a last resort.","pages":[100]},"why":[{"text":"Sleep trouble that won't go away may stem from an underlying health condition, or may warrant more intensive treatment. Cognitive behavioral therapy, for one, has shown efficacy for sustained sleep disturbance.","pages":[100]},{"text":"The best-known non-benzodiazepine hypnotic may harm sleep architecture and glymphatic function. The upshot: even with more time in bed, sleep may not do its cleaning job.","pages":[100,101]},{"text":"Benzodiazepines are older medications that work by boosting the effects of GABA—and they can be addictive.","pages":[101]},{"text":"DORAs take a different route: rather than sedating you directly, they reduce the action of orexin and wakefulness circuits. A meta-analysis found them generally safe, with improved sleep versus placebo.","pages":[102]}],"steps":[{"text":"Still struggling after the prior sleep protocols and the stress-management protocols? If so, talk to your doctor.","pages":[100]},{"text":"Avoid prescription sleep aids if you can. Use them only if your physician prescribes them as a last resort.","pages":[100]},{"text":"Know what you'd be taking: how each common class of sleep drug works, and its potential risks.","pages":[100]}],"numbers":[{"text":"These newer drugs don't come cheap, and generic lower-cost versions aren't available yet.","pages":[102],"label":"DORA cost","value":"About $300+ per month"},{"text":"Across people with insomnia, DORAs were found generally safe, with improved sleep versus placebo.","pages":[102],"label":"DORA meta-analysis","value":"10 trials, 7,086 people"}],"cautions":[{"text":"Be aware: most prescription sleep aids can carry side effects like confusion and daytime drowsiness.","pages":[100]},{"text":"Don't assume the seemingly safer ones (trazodone, DORAs) are harmless. They're easy to become dependent on, none are free of side effects, and withdrawal has its own.","pages":[100]},{"text":"Caution: benzodiazepines can have serious side effects, among them confusion, memory problems, unsteadiness and slurred speech. And getting off them is notoriously hard.","pages":[101]},{"text":"Non-benzodiazepine hypnotics carry an FDA black box warning, issued after reports of rare but dangerous behavior during sleep—wandering, driving, using a stove—plus amnesia afterward.","pages":[101]}],"tags":[{"text":"medication"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"sleep-11","number":11,"title":"Adjust Your Caffeine Schedule to Improve Your Sleep","page":103,"summary":{"text":"The point is to time caffeine so it protects your sleep. Avoid it 8–10 hours before bed. And if you crash in the afternoon despite sleeping well, consider delaying your first caffeine after waking.","pages":[103]},"why":[{"text":"Caffeine works by blocking adenosine receptors. That's why your brain doesn't accurately register the fatigue that builds while you're awake.","pages":[105]},{"text":"That explains the crash. When caffeine wears off a few hours later, the adenosine that accumulated can suddenly bind—and fatigue hits.","pages":[105]},{"text":"Caffeine also makes it take longer to fall asleep, causes more nighttime waking, and can alter sleep architecture (the structure of your sleep stages), including less REM.","pages":[104]},{"text":"Put simply: the closer to bedtime you have caffeine, and the more sensitive you are to it, the bigger its impact on sleep.","pages":[106]}],"steps":[{"text":"Cut off caffeine eight to ten hours before bed—especially if you have trouble falling asleep.","pages":[103]},{"text":"Especially caffeine sensitive? You may need to avoid it in the twelve hours before bedtime.","pages":[103]},{"text":"Crash in the afternoon even after sleeping well? Consider delaying caffeine 30–90 minutes after waking (elsewhere the book suggests trying 60–90 for a few days).","pages":[103,107]},{"text":"Ease in: maybe start with a thirty-minute delay, then sixty, then ninety—and see if you still need afternoon caffeine.","pages":[107]},{"text":"Struggling through the afternoon without caffeine? Try NSDR (non-sleep deep rest, Sleep Protocol 8).","pages":[107]},{"text":"Exercise soon after waking and need caffeine for it? Then drink it on waking—just hydrate well, and it's probably best to hydrate first.","pages":[107]},{"text":"Waking unrefreshed after seven to eight hours of sleep? You may try cutting caffeine eight to ten, or even twelve, hours before sleep. Then note how you feel.","pages":[106]}],"numbers":[{"text":"Keep this window caffeine-free.","pages":[103],"label":"Bedtime cutoff","value":"8–10 hours before bed"},{"text":"Some especially caffeine-sensitive people may need this longer cutoff.","pages":[103],"label":"Sensitive cutoff","value":"12 hours before bed"},{"text":"The book gives both figures in different places. Consider it if you crash in the afternoon despite sleeping well.","pages":[103,107],"label":"Morning delay","value":"30–90 or 60–90 min after waking"},{"text":"In a study of over 100,000 people, this daily caffeinated coffee or tea intake can reduce stroke and dementia risk.","pages":[105],"label":"Daily coffee/tea","value":"About 2–3 cups"},{"text":"Beyond this, you generally hit diminishing returns or possibly negative effects. Larger people may handle more.","pages":[108],"label":"Upper amount","value":"4 cups (400 mg)/day"}],"cautions":[{"text":"Don't be fooled: even if you can fall asleep after coffee, you're likely not getting the best sleep you could.","pages":[103]},{"text":"Be clear on the evidence: delaying morning caffeine is just a suggestion. No clinical trial supports it, though it has mechanistic support.","pages":[107]},{"text":"Keep in mind that caffeine can be a mild diuretic, and you tend to wake slightly dehydrated.","pages":[107]}],"tags":[{"text":"drink"},{"text":"timing"}],"when":[{"text":"morning"},{"text":"afternoon"}],"schedule":[{"text":"Afternoon crashes? Delay caffeine 30–90 min","pages":[103],"anchor":"wake","start_min":30,"end_min":90},{"text":"Or try delaying caffeine 60–90 min","pages":[107],"anchor":"wake","start_min":60,"end_min":90},{"text":"Caffeine-free zone (8–10 h before bed)","pages":[103],"anchor":"bed","start_min":-600,"end_min":0}]},{"id":"sleep-12","number":12,"title":"Avoid Alcohol Within Eight Hours Before Sleep","page":110,"summary":{"text":"Alcohol is not a sleep aid—don't use it as one. If you drink, keep alcohol out of the eight hours before you plan to be asleep, so less of it is in your body at bedtime.","pages":[110]},"why":[{"text":"Even if alcohol helps you drift off and you get seven to eight hours, quality suffers. That's because it severely disrupts sleep architecture and reduces deep and REM sleep.","pages":[110]},{"text":"During the first half of the night, alcohol both suppresses REM sleep and delays how soon you reach it.","pages":[111]},{"text":"It's also been found to cut the growth hormone and testosterone your body releases during the night.","pages":[111]},{"text":"The key is timing. Only if alcohol is metabolized before bedtime do you avoid some of these consequences—which is why the protocol sets a specific cutoff.","pages":[111]}],"steps":[{"text":"Don't reach for alcohol as a sleep aid.","pages":[110]},{"text":"If you drink, finish at least eight hours before the time you plan to be asleep.","pages":[110]},{"text":"Had a drink in the eight hours before sleep anyway? Drink enough water before bed and after waking, and take electrolytes if you can.","pages":[112]},{"text":"Then lean on other behaviors that support great sleep and a healthy microbiome to try to offset alcohol's effects.","pages":[112]}],"numbers":[{"text":"If you drink, keep this window alcohol-free.","pages":[110],"label":"Cutoff","value":"8 hours before sleep"},{"text":"Fine for nonalcoholic adults without confounding medical issues. Still, zero is better—and the data on alcohol's cancer risk are growing.","pages":[110],"label":"Weekly drinks","value":"0–2 per week"},{"text":"A late drink this rarely is very unlikely to do long-term harm—unless it's excessive.","pages":[112],"label":"Occasional late drink","value":"Once a month or less"}],"cautions":[{"text":"Don't make it a habit: drinking within eight hours of sleep every night, several times a week, or even once a week will disrupt sleep and health.","pages":[112]},{"text":"Caution: the harm to REM and hormones shows up after even a single night of drinking—or even one drink, for alcohol-sensitive people.","pages":[111]},{"text":"Don't look for a \"better\" drink: the type of alcohol doesn't matter for sleep. No alcohol beats any alcohol.","pages":[113]},{"text":"If you do drink, be careful: make sure it isn't too often, you're not driving, you're not dependent and you're not too young. Effects are much worse on the developing brain.","pages":[113]}],"tags":[{"text":"drink"},{"text":"timing"}],"when":[{"text":"evening"}],"schedule":[{"text":"Alcohol-free window (8 h before sleep)","pages":[110],"anchor":"bed","start_min":-480,"end_min":0}]},{"id":"sleep-13","number":13,"title":"Avoid Cannabis as a Sleep Aid","page":114,"summary":{"text":"Don't use cannabis to fall asleep or to get back to sleep. That's because it potently reduces REM sleep. Any sleep benefit from CBD seems to come mainly from reduced anxiety.","pages":[114]},"why":[{"text":"THC potently cuts REM sleep—even at low doses.","pages":[115]},{"text":"Relying on THC to fall asleep disrupts your sleep-wake cycle. That, in turn, can raise your risk of health issues tied to too little REM, including depression and cardiovascular disease.","pages":[115]},{"text":"CBD works differently. Its possible sleep benefits likely come from lowering anxiety—it may help you stop ruminating, which is a prerequisite for falling asleep.","pages":[116]}],"steps":[{"text":"Skip cannabis as a way to help you fall asleep, or to get back to sleep after waking at night.","pages":[114]},{"text":"Some evidence links CBD to better sleep, mostly by easing anxiety. At higher doses (e.g., 160 mg+), it acts more as a sedative—and the effective dose varies by weight and other factors.","pages":[114]},{"text":"Feeling stressed at night? There are no known negative effects of CBD that rule out trying it for sleep—though rigorous evidence of a direct benefit is insufficient.","pages":[116]},{"text":"Want to improve sleep or manage stress? Reach for the better tools in the book's other protocols instead.","pages":[117]}],"numbers":[{"text":"At doses this high, CBD acts more like a sedative.","pages":[114],"label":"Sedative CBD dose","value":"160 mg or more"},{"text":"In a small 2024 trial versus placebo, there was no difference in sleep onset, efficiency, duration or severity—but fewer night wakings after two weeks.","pages":[116],"label":"Trial dose","value":"150 mg CBD"}],"cautions":[{"text":"Caution: a growing number of studies report THC (but not CBD) may induce psychosis in certain individuals.","pages":[116]},{"text":"During pregnancy, cannabis has been tied to lower birth weight—and neonatal and infant death rates are higher with it.","pages":[116]},{"text":"Teens, take note: in one study of adolescents, THC's sedative effects were followed by more night waking and impaired memory the next day.","pages":[115]}],"tags":[{"text":"medication"}],"when":[{"text":"bedtime"}],"schedule":[]},{"id":"sleep-14","number":14,"title":"Avoid Screens Within an Hour or More Before Bedtime","page":118,"summary":{"text":"Keep screens out of the bedroom at night, and stop consuming information on devices at least an hour before bed. Why? Screen light can disrupt your circadian clock.","pages":[118]},"why":[{"text":"Here's the issue: light from phones and other screens can throw off your circadian clock.","pages":[118]},{"text":"Evidence suggests LED screens can interrupt melatonin production. In a 2014 study, people reading e-books at night took longer to fall asleep and had lower melatonin than those reading printed books.","pages":[119]},{"text":"Interactive technology also revs up the brain, which works against the calm you need to fall asleep.","pages":[119]},{"text":"In a 2011 poll, the more technology people used in the hour before bed, the harder it was to fall asleep.","pages":[119]}],"steps":[{"text":"Keep screens out of the bedroom at night—phones, laptops, tablets and TVs included.","pages":[118]},{"text":"Give yourself at least an hour before bedtime with no information coming in from electronic devices.","pages":[118]},{"text":"Screen in the hour before sleep? If so, dim it—lower the brightness and/or turn on the red screen function.","pages":[118]},{"text":"You can also wear glasses that block blue and green light. They work better than blue-only blockers, which help somewhat.","pages":[118,120]},{"text":"Reserve your bedroom for sleep and intimacy—nothing else.","pages":[120]}],"numbers":[{"text":"No consuming information on electronic devices this long before bed.","pages":[118],"label":"Screen-free window","value":"At least 1 hour"}],"cautions":[{"text":"Be especially careful with interactive devices. In the 2011 poll, game consoles, phones and laptops were more problematic than passive ones like e-readers.","pages":[118,119]},{"text":"Scrolling isn't the only culprit. In one study, simply sleeping with the phone in the room, ringer on, also contributed to the problem.","pages":[120]}],"tags":[{"text":"light"},{"text":"environment"}],"when":[{"text":"bedtime"}],"schedule":[{"text":"Screens off (at least 1 h before bed)","pages":[118],"anchor":"bed","start_min":-60,"end_min":0}]},{"id":"sleep-15","number":15,"title":"A Tip Sheet for Avoiding Jet Lag","page":121,"summary":{"text":"You can shift your circadian clock to a new time zone quickly. The tools are light, caffeine, exercise and meal timing—used before you travel and after you arrive.","pages":[121,122,123]},"why":[{"text":"Five things shift your clock. Ranked from most to least influential: light, temperature, meal times, exercise and social factors.","pages":[121]},{"text":"Why not just hop on the local schedule? Because your SCN (your master clock) is still entrained to wherever you were for the week or so before your trip.","pages":[121]},{"text":"Flying east is typically harder. That's because most people find it easier to stay up later than to fall asleep earlier.","pages":[122]},{"text":"The key is your temperature minimum. Bright light in the 1–2 hours after it shifts you earlier (good for east); in the 1–2 hours before, it shifts you later (good for west).","pages":[123]}],"steps":[{"text":"Heading east? Starting two days before you fly, try waking 30–45 minutes earlier, get bright light on waking, drink caffeine early, and exercise within 60 minutes.","pages":[122]},{"text":"Heading west? Before you go, shift waking, caffeine and workouts 30–45 minutes later (still no caffeine 8–10 hours before bed), and view bright artificial light 1–2 hours after sunset.","pages":[122]},{"text":"Once you land, eat meals at about local times—even if you're not hungry—and keep a consistent early-in-the-day exercise routine on local time.","pages":[123,125]},{"text":"Time bright light by your home temperature minimum (about two hours before your usual waking time). Light 1–2 hours after it shifts you earlier; 1–2 hours before shifts you later.","pages":[123]},{"text":"Say you're flying San Francisco to London. For the first two days, wear dark sunglasses 2–3 hours before your home temperature minimum; after two or three days, view sunlight normally.","pages":[123,124]},{"text":"Pack a portable 5,000–10,000 lux light for cloudy days or night arrivals. Still, cloudy daylight is almost always far brighter, so get outside at the correct times.","pages":[124]},{"text":"As bedtime nears, cut bright light, especially blue and green. Huberman's own practice: blue- and green-blocking glasses after sundown to help him adjust.","pages":[124]}],"numbers":[{"text":"Shift earlier before flying east (starting two days ahead), later before flying west.","pages":[122],"label":"Pre-trip shift","value":"30–45 minutes"},{"text":"Many people find it effective to fast this long before local breakfast time—so they arrive at it very hungry.","pages":[123],"label":"Pre-breakfast fast","value":"14–16 hours"},{"text":"If you usually wake at 7:00 a.m., yours is very likely between 4:30 and 5:30 a.m.","pages":[123],"label":"Temperature minimum","value":"~2 hours before waking"},{"text":"The brightness to look for when you pack a portable light.","pages":[124],"label":"Light device","value":"5,000–10,000 lux"},{"text":"San Francisco–London example: wear dark sunglasses this long before your home temperature minimum, first two days.","pages":[123,124],"label":"Sunglasses window","value":"2–3 hours"}],"cautions":[{"text":"Caution: use your temperature minimum from before you leave. Get this wrong, and the light timing can make things a mess.","pages":[123]},{"text":"Watch out on a San Francisco to London trip: in the first 2–3 days, London morning sunlight shifts your clock later. Many sleep well the first night after flying east, then badly the second.","pages":[123,124]},{"text":"Short trip—under two days? It can be beneficial to stay on or near your home schedule for sleep-wake, eating and exercise.","pages":[125]}],"tags":[{"text":"light"},{"text":"timing"},{"text":"movement"}],"when":[{"text":"as-needed"}],"schedule":[]}]},{"key":"exercise","name":"Exercise","short":"Exercise","color":"#b8432f","ink":"#fff6e8","intro":{"text":"Here's the key idea: exercise is just the stimulus. The real gains are the specific and general adaptations it triggers in your body and brain. There are three basic varieties to train: resistance, cardiovascular, and mobility/flexibility. These protocols pair a foundational program of three brief but intense resistance sessions and three cardio sessions a week with daily walking and quick mobility work.","pages":[138,139,140,148,149]},"protocols":[{"id":"exercise-01","number":1,"title":"Walk as Much as Possible Each Day","page":150,"summary":{"text":"Build walking into every day, especially after meals and to break up long stretches of sitting. Don't think of it as an add-on workout. It's the bedrock of a healthy lifestyle.","pages":[150]},"why":[{"text":"Start with the data: in one study, people taking at least 7,000 steps a day had a significantly lower mortality risk over the decade studied.","pages":[151]},{"text":"Every step involves repeated muscle contractions, and those activate AMPK—an enzyme involved in stimulating glucose uptake into muscle cells.","pages":[152]},{"text":"Timing matters. A review found that walking within 30 minutes after a meal beats walking before a meal or after a break for lowering glucose.","pages":[152]},{"text":"Walking while looking forward and around makes the amygdala less active—and that reduces stress and anxiety.","pages":[154]}],"steps":[{"text":"Walk for 5–10 minutes after meals if you can. That's when walking's health benefits are amplified.","pages":[150]},{"text":"Break up sitting or standing: for every 30 minutes, walk or pace for at least 5, if you can.","pages":[150]},{"text":"Aim for 7,000 steps a day—10,000 is even better. A tracker or your phone can help you count, but isn't necessary.","pages":[150]},{"text":"Set a goal of at least 30 minutes of brisk walking a day—ideally 40–60 minutes.","pages":[155]},{"text":"At a desk for long stretches? Consider a sit-stand desk—or better yet, a walk-and-work desk with a treadmill underneath.","pages":[150]},{"text":"In a meeting or on a plane and unable to walk? Try calf raises.","pages":[156]},{"text":"Already walking often? Try picking up the pace a little. Faster walking gets you the health benefits in less time.","pages":[156]}],"numbers":[{"text":"Seven thousand steps is roughly an hour of walking—and you can spread it across the day.","pages":[150,156],"label":"Daily steps","value":"7,000 (10,000 even better)"},{"text":"Walk after meals—that's when the health benefits are amplified.","pages":[150],"label":"After meals","value":"5–10 minutes"},{"text":"For every 30 minutes of sitting or standing, walk or pace at least this much.","pages":[150],"label":"Sitting breaks","value":"5+ min per 30 min"},{"text":"Your daily target for brisk walking.","pages":[155],"label":"Brisk walking","value":"30+ min, ideally 40–60"},{"text":"Can't walk? This is an alternative: over an 8.5-hour day, it was shown to lower glucose better than 30 minutes of walking.","pages":[156],"label":"Air squats","value":"10 every 45 minutes"}],"cautions":[{"text":"Don't stare at your phone while you walk. It blocks the eye movements behind walking's stress-reducing benefit.","pages":[154]},{"text":"Air squats are no full substitute: they don't give you all of walking outside's benefits, such as optic flow, fresh air, and sunlight.","pages":[156]},{"text":"Huberman believes treadmill walking or running beats not exercising, but is less stress-reducing than doing it outdoors.","pages":[154]},{"text":"Don't stop at walking. It's necessary but not sufficient for your health, so you still need the other kinds of training.","pages":[157]}],"tags":[{"text":"movement"},{"text":"timing"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"exercise-02","number":2,"title":"Resistance Train Three Times per Week","page":158,"summary":{"text":"Three resistance training sessions every seven days: that's the foundational template. Huberman sees it as the best place to start for all-around fitness, and believes it gives the best results for the time and effort you put in.","pages":[158]},"why":[{"text":"The key is progressive overload—challenging muscles by increasing the weight or the reps, or both, while keeping form excellent. No overload, no progress.","pages":[160,178]},{"text":"You don't need endless volume. Studies suggest roughly 4–8 work sets per muscle group is both necessary and enough for near-maximal strength and/or size gains.","pages":[168]},{"text":"Each muscle group gets trained directly once a week, then indirectly a second time through other sessions—cardio included.","pages":[169]},{"text":"The workout is just the signal. The actual changes in muscles, connective tissues, and brain happen in the two to four days afterward—mostly during sleep.","pages":[181]}],"steps":[{"text":"Follow the weekly template. Cardio: Days 1, 5, and 6. Legs: Day 2. Rest: Day 3. Torso: Day 4. Shoulders and arms: Day 7.","pages":[158]},{"text":"New to lifting? First, take one to three weeks to find movements that suit your body, and learn them with relatively light weights.","pages":[130,159]},{"text":"Warm up for ~5 minutes, then do warm-up sets—never near failure: 6–10 reps at ~40% of work weight, then 4–8 at ~65%. Going heavy? Add 2–4 at ~75%.","pages":[159,165]},{"text":"For each muscle group, pick 2–3 exercises—at least one compound and one isolation—and do 2–3 work sets of each (usually 2).","pages":[159]},{"text":"Take every work set to failure in good form, even if that's past your target reps. On the first set, keep trying to move the stalled weight for 3–5 more seconds.","pages":[176,179]},{"text":"Once you can hit 10 reps on a compound exercise, or 10–15 on an isolation exercise, in perfect form, add weight for those work sets next workout.","pages":[160]},{"text":"Track your sets, reps, and weights every session. That way you can make sure you're using progressive overload.","pages":[163]}],"numbers":[{"text":"Sessions should rarely run longer. Under 60 minutes is even better—if you still get a great workout.","pages":[159,161,162],"label":"Session length","value":"About 60 +/- 20 minutes"},{"text":"Recommended max: 9 per workout. Got a muscle group that responds easily? Limit it to 4–5, or even 3.","pages":[159,166,170],"label":"Work sets","value":"4–9 per muscle group"},{"text":"Treat this as a general guideline; the book also suggests mainly 5–12 reps for compound work sets, occasionally 3–5.","pages":[159,177],"label":"Reps to failure","value":"Compound 6–10; isolation 8–15"},{"text":"Rest typically 3–5 minutes after compound work sets, and 90 seconds to 3 minutes after isolation work sets.","pages":[160],"label":"Rest between sets","value":"Warm-up 1–2 min; work 2–5"},{"text":"Take a full week off resistance training. It lets your joints, mind, and tissues reset and catch up.","pages":[187],"label":"Week off","value":"Every 12–16 (or 10–12) weeks"}],"cautions":[{"text":"Caution: people have died bench-pressing. For bench presses and barbell squats, use a capable spotter—or dumbbells, or a rack with safety pins.","pages":[173]},{"text":"Sharp or dull joint pain from an exercise? Don't push through it—at least not that day. Find an alternative.","pages":[174]},{"text":"Huberman recommends most people avoid one-rep-max lifts because of the injury risk. Really want to do them? Use a spotter.","pages":[179]},{"text":"Limit going past failure (forced reps, drop sets) to 2–3 sets per workout at most—and skip it entirely on days you feel stressed.","pages":[180]}],"tags":[{"text":"movement"},{"text":"rest"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"exercise-03","number":3,"title":"Do Cardiovascular Training Three Times per Week","page":191,"summary":{"text":"Do three cardio sessions a week on non-resistance days: one long and low-intensity, one medium and moderate, and one brief and high-intensity. Mixing them typically gives the best VO2 max results.","pages":[159,191,197]},"why":[{"text":"The long, low-intensity session mainly builds your heart's stroke volume (meaning, how much blood it pumps per beat). That's what brings a lower resting heart rate.","pages":[192]},{"text":"All three sessions improve how well your heart delivers blood, trigger capillary growth in your muscles, and increase the number, size, and efficiency of your mitochondria.","pages":[197]},{"text":"The point is the mix: combining all three types is typically what delivers the best VO2 max results over time.","pages":[197]},{"text":"And the stakes are real: moving from the lowest to higher tiers of cardiorespiratory fitness is linked to lower mortality risk.","pages":[199]}],"steps":[{"text":"Day 1: go long and easy—45–75 minutes of continuous, low-intensity cardio, at a pace where you can just barely hold a conversation.","pages":[191,192]},{"text":"If you're out of shape, start the long session at 15–20 minutes, then add a few minutes each week until you hit 45–75.","pages":[192]},{"text":"Another way to set the long-session pace: go as hard as you can while still breathing only through your nose.","pages":[192]},{"text":"Day 5: warm up with 5 minutes of low-intensity movement, then hold about 75–85% of max heart rate for 25–30 minutes.","pages":[194]},{"text":"Day 6: warm up for 5–10 minutes, then go intense, totaling about 6 to 16 minutes of near-all-out effort.","pages":[191,195]},{"text":"One intense option: 30 seconds all-out, then 60 seconds of rest or slower movement. Repeat for 6–12 rounds.","pages":[195]},{"text":"You don't have to run. Choose any activity you can do at the required duration and intensity without getting hurt.","pages":[193]}],"numbers":[{"text":"Keep it continuous and low intensity—ideally closer to 70% of max heart rate.","pages":[191,193],"label":"Long session","value":"45–75 min, 60–70% max HR"},{"text":"You should be breathing fairly hard—but never gasping for air or needing to stop to recover.","pages":[191,194],"label":"Moderate session","value":"25–30 min, 75–85% max HR"},{"text":"That's the listed session length. Total near-all-out time is about 6–16 minutes, with HIIT efforts reaching 90–95% of max heart rate.","pages":[191,195],"label":"Intense session","value":"6–17 minutes"},{"text":"Want more precision? Men: 208 − 0.7 × age. Women: 206 − 0.88 × age.","pages":[193],"label":"Max heart rate","value":"About 220 minus age"},{"text":"It's one option for the intense day; others include the 12-minute Cooper test or a best-mile run.","pages":[196,197],"label":"Norwegian 4×4","value":"4 min hard, 4 easy, ×4"}],"cautions":[{"text":"Caution: don't sprint the day after training legs to failure. The injury risk is t
