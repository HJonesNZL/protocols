oo high.","pages":[198]},{"text":"On the long session, if you feel you need to gasp for air through your mouth, you're going too hard.","pages":[192]},{"text":"If you miss long cardio day, don't move it onto leg day. Skip it and keep leg day on schedule. Skipping leg day is a bad idea.","pages":[201]},{"text":"Slept poorly? Don't push too hard—injuries are more common. After two or more really bad nights, fix sleep first, or keep your exercise restorative.","pages":[200]}],"tags":[{"text":"movement"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"exercise-04","number":4,"title":"Incorporate Brief Mobility and Flexibility Work Two to Four Times per Week","page":202,"summary":{"text":"Spend about ten minutes on four specific mobility movements, two to four times a week, to keep your wrists, back, knees, hips, and shoulders mobile. They can help a lot against common injuries.","pages":[202]},"why":[{"text":"Wrist, back, knee, hip, and shoulder injuries are common. That's why these movements target those areas—they're meant to ensure mobility there.","pages":[202]},{"text":"Some studies find that resistance training through a full range of motion can be as effective as static stretching. The key may be controlling the lowering phase.","pages":[203]},{"text":"Modern life keeps your hip flexors in a flexed state. That's why being able to extend your hips is a key step toward good mobility.","pages":[205]},{"text":"Many people lack shoulder extension mobility, and desk work and chin-down phone posture only make it worse.","pages":[207]}],"steps":[{"text":"Deep sumo squat: feet a bit wider than your shoulders, elbows pushing knees out. Point one arm up and look at your finger for 3–10 seconds; 3 times per side.","pages":[204]},{"text":"Standing lunge stretch: bring your back knee behind your glutes, then exhale and slowly ease into the hip-flexor stretch for 10–30 seconds. Do it 3 times per side.","pages":[205]},{"text":"Kneeling stretch: with one knee up in front and your torso upright, gently extend the back leg. Hold 10–30 seconds; repeat 3–4 times.","pages":[205]},{"text":"Reverse tabletop: sit with hands beside your hips, fingers pointing out, and push your pelvis up until thighs and torso are flat. Try to hold it for 10 seconds.","pages":[206]},{"text":"Can't hold it yet? Practice 3 sets a week, as long as you can. Once you can hold 10 seconds, progress to hands behind hips, fingers pointing back.","pages":[206]},{"text":"Founder pose: feet wider than shoulders, hinge your hips back about a third of the way down, turn thumbs out and slowly raise your arms. Then hold 5 more seconds.","pages":[208]},{"text":"Repeat the Founder pose 1–2 times. Do it as often as every day, or just a few times a week.","pages":[208]}],"numbers":[{"text":"You can tack it onto the end of another workout, or do it any time of day.","pages":[202],"label":"Session length","value":"About 10 minutes"},{"text":"Do all four movements every session.","pages":[204],"label":"Frequency","value":"At least 2–4 times weekly"},{"text":"Keep your gaze up on your raised index finger.","pages":[204],"label":"Sumo look-up","value":"3–10 seconds, 3× per side"},{"text":"Applies to both the standing lunge and the kneeling version.","pages":[205],"label":"Hip-flexor holds","value":"10–30 seconds"},{"text":"Your target hold for each reverse tabletop variation.","pages":[206],"label":"Tabletop hold","value":"10 seconds"}],"cautions":[{"text":"Don't rush. Work through the progressions over months or more—keep it painless but deliberate.","pages":[207]},{"text":"If you can't yet point or look straight overhead in the sumo squat, start at a lower angle and progress gradually.","pages":[204]},{"text":"Caution: don't try the straight-leg shoulder stretch (scooting your glutes forward) until the final reverse tabletop is achievable—and go slowly.","pages":[206]},{"text":"Be realistic: these movements don't guarantee you won't get injured, though they can help tremendously.","pages":[202]}],"tags":[{"text":"movement"}],"when":[{"text":"anytime"}],"schedule":[]}]},{"key":"stress","name":"Stress Control","short":"Stress Control","color":"#1f7a64","ink":"#ffffff","intro":{"text":"Stress is nature's one-size-fits-all answer to anything urgent. A short bout? No big deal. But weeks of daily stress—that's when it starts to harm us. The goal here is twofold: control your stress response in the moment, and raise your stress threshold.","pages":[211,212,213]},"protocols":[{"id":"stress-01","number":1,"title":"Do One to Three Physiological Sighs to Reduce Stress Fast","page":222,"summary":{"text":"The physiological sigh: two inhales through the nose, then a long exhale through the mouth. Do it up to three times in a row to bring your stress level down—fast.","pages":[222]},"why":[{"text":"That's because longer or more forceful exhales slow your heart rate. Exhales also activate a branch of the vagus nerve, part of your calming (parasympathetic) system.","pages":[225]},{"text":"The quick second inhale helps reinflate collapsed air sacs in your lungs (the alveoli). Inhaling through the nose adds resistance—and so more force.","pages":[226]},{"text":"Put simply, it works three ways at once: it slows your heart rate, restores the oxygen-to-carbon-dioxide balance, and engages brain areas that let you think logically.","pages":[226]},{"text":"The key is that breathing is the one part of your autonomic nervous system you can consciously and directly control—at any moment.","pages":[219,224]}],"steps":[{"text":"Start with a deep inhale through your nose until your lungs are full, letting your belly expand.","pages":[222]},{"text":"Then, right away, sneak in a second sharp inhale through your nose to fully inflate your lungs.","pages":[222]},{"text":"Now exhale slowly through your mouth until your lungs are empty.","pages":[222]},{"text":"Repeat up to three times in a row, as needed. Often, just one sigh does the trick.","pages":[222]},{"text":"Use it whenever things get tense: before public speaking or a hard conversation, stuck in traffic, or running late to an important meeting.","pages":[227]},{"text":"Optional: do five minutes of physiological sighs on repeat to help buffer against future stress. (That's what the study group did, daily.)","pages":[227]}],"numbers":[{"text":"Repeat up to three times back-to-back, as needed.","pages":[222],"label":"Repetitions","value":"1–3 sighs"},{"text":"In a 108-person study, daily cyclic sighing had a notably bigger effect on mood.","pages":[227],"label":"Buffer practice","value":"5 minutes per day"}],"cautions":[{"text":"Don't \"take a deep breath\"—that's the opposite of what helps. When stress hits, emphasize a big exhale.","pages":[225]},{"text":"Be realistic: it won't guarantee you respond the right way. But it puts you in a better state to navigate the stress.","pages":[227]}],"tags":[{"text":"breathing"}],"when":[{"text":"as-needed"}],"schedule":[]},{"id":"stress-02","number":2,"title":"Use Deliberate Cold Exposure to Raise Your Stress Threshold","page":229,"summary":{"text":"Get into uncomfortably cold water—anything from a cold shower to an ice bath—three to seven times a week to raise your stress threshold.","pages":[229,230]},"why":[{"text":"The moment you enter the cold, you tilt sharply toward the sympathetic (alert) side—within one to two seconds. Afterward, you tend to stay alert but calm for hours.","pages":[231]},{"text":"Cold raises adrenaline, norepinephrine and dopamine (plus cortisol). Those chemicals boost mood, energy and alertness—and they can raise your stress threshold.","pages":[231]},{"text":"The key is choice. When you choose the stress, control how long it lasts and understand its benefit, it can become helpful stress (what's called \"eustress\").","pages":[233]},{"text":"Better still, handling cold stress helps you get better at handling other stressful moments. That effect is called cross adaptation.","pages":[233]}],"steps":[{"text":"Get into uncomfortably cold water three to seven times per week. A cold shower counts; so does an ice bath.","pages":[229]},{"text":"Pick a duration: one to three minutes, or a number of \"walls\" you decide in advance. Every time you want out but stay in counts as one wall.","pages":[229]},{"text":"Use water cold enough that you want out right away, yet safe to stay in for up to three minutes. For most people, that's 40–50°F.","pages":[229,230]},{"text":"If you're new to this, start slowly, with short exposures—a cold shower lets you adjust the temperature quickly.","pages":[240]},{"text":"Lower yourself in while holding something stationary, or back into a cold shower. Go in up to your neck—hands under last.","pages":[240]},{"text":"In the first 30 or so seconds, don't just grind through. Consciously watch your mind swing back and forth between wanting out and knowing you've got this.","pages":[238]},{"text":"Hate the cold, or can't access it? Then try cyclic hyperventilation instead—three to five minutes, away from water.","pages":[241,242]}],"numbers":[{"text":"How often to do deliberate cold exposure each week.","pages":[229],"label":"Frequency","value":"3–7 times per week"},{"text":"Per session, if you go with the timed option.","pages":[229],"label":"Duration","value":"1–3 minutes"},{"text":"Does it burn or give you a headache? Then it's probably too cold.","pages":[230],"label":"Water temperature","value":"40–50°F for most"},{"text":"Don't stay in the cold any longer than this.","pages":[239],"label":"Maximum time","value":"5 minutes"},{"text":"The book suggests 2–10 walls in one passage and 2–8 in another. Some days, two is enough.","pages":[229,237,239],"label":"Walls option","value":"2–10 or 2–8 walls"}],"cautions":[{"text":"Caution: cold in the 6–8 hours after resistance training can blunt strength and muscle gains. Do it before training, on rest days, or 6+ hours after.","pages":[230]},{"text":"Never combine cold water with deliberate hyperventilation, before or during—it can make you black out and drown. And never do cyclic hyperventilation while driving or operating machinery.","pages":[241,242]},{"text":"Caution: never jump or dive into very cold water. Avoid cold or frozen outdoor water unless an expert is with you, you know the spot, and real safety measures exist.","pages":[240]},{"text":"Don't do it when you're sick with a cold, flu or other respiratory illness. Pregnant? There's little data, so avoid it if you're concerned.","pages":[240]}],"tags":[{"text":"temperature"},{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"stress-03","number":3,"title":"Do Non-Sleep Deep Rest (NSDR) to Buffer Against Stress","page":243,"summary":{"text":"Non-sleep deep rest: a 10–30 minute guided session of deep, self-directed relaxation—while you stay awake. It buffers you against acute and chronic stress and restores your energy.","pages":[243,244]},"why":[{"text":"NSDR increases calming parasympathetic activity. Yet because you stay awake, your sympathetic (alert) system stays engaged too.","pages":[244]},{"text":"You can't switch off your thoughts. What you can do is shift from planning and analyzing to simply feeling physical sensations.","pages":[244,245]},{"text":"During NSDR, cortisol drops. Some brain areas fall asleep while others stay active. People typically come out of it alert but calm.","pages":[244,245]},{"text":"That's what sets it apart from mindfulness meditation, which builds up gradually with practice. NSDR can work the first time—and every time.","pages":[245]}],"steps":[{"text":"Sit—or ideally lie down—somewhere quiet.","pages":[243]},{"text":"Listen to a scripted, guided NSDR session for 10 to 30 minutes. Free guided sessions are available online, and you can download them.","pages":[243]},{"text":"Move your attention deliberately from one sensation to the next—for example, your toes, then your fingers, then the sounds in the room.","pages":[245]},{"text":"Ideally, do it once a day. That said, it helps reduce stress at any point.","pages":[243]},{"text":"Lean on it during high-stress stretches that last weeks or longer: intense work or school, deadlines, raising young kids, or caring for an elder.","pages":[243]},{"text":"If you wake in the night and can't get back to sleep, get up, do an NSDR, then climb back into bed.","pages":[246]}],"numbers":[{"text":"How long one NSDR session runs.","pages":[243],"label":"Duration","value":"10–30 minutes"},{"text":"That's the ideal—but it's beneficial for stress at any point.","pages":[243],"label":"Frequency","value":"Ideally once per day"}],"cautions":[{"text":"Don't confuse NSDR with a nap, hypnosis or meditation. You deliberately stay awake.","pages":[244]},{"text":"Don't try to destress by not thinking—it won't work. Shift your focus to sensations instead.","pages":[245]}],"tags":[{"text":"rest"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"stress-04","number":4,"title":"Do a Micro Meditation Immediately After Waking Up","page":247,"summary":{"text":"A simple five-minute daily meditation, done before you get out of bed in the morning (though any time of day can help). It's resilience training: learning to sit with stress so you handle real-life stressors better.","pages":[247]},"why":[{"text":"There's plenty of evidence that mindfulness meditation buffers against stress. Even brief daily sessions reduce anxiety.","pages":[247]},{"text":"Forcing your focus back to your breath when your mind wants to plan can be maddening. That's the point—it's how the practice can raise your stress threshold.","pages":[248]},{"text":"Put simply, regular meditation teaches you to observe your arousal rather than act on it. It also makes stressors less likely to hijack your mind.","pages":[248]},{"text":"The underlying mechanism appears to be linked to GABA, an inhibitory brain chemical—meaning it generally suppresses the firing of other neurons.","pages":[248]}],"steps":[{"text":"Stay in bed (or, if you must, use the bathroom first) and set a timer for five minutes.","pages":[249]},{"text":"Sit or lie down and keep as still as you can, focusing on your breathing.","pages":[249]},{"text":"Breathe slowly in and out—through your nose only.","pages":[249]},{"text":"Your mind will wander. That's normal. When it does, bring your focus back to your breath.","pages":[249]},{"text":"If the urge to get out of bed hits before five minutes are up, stay put.","pages":[247]},{"text":"Do it even on days you feel stressed. Those are a bonus opportunity.","pages":[249]}],"numbers":[{"text":"Longer meditation is fine too, if you want it.","pages":[247,249],"label":"Duration","value":"5 minutes daily"}],"cautions":[{"text":"This isn't about clearing your mind. Expect even a short practice like this to stir up some stress—sitting with it is the whole point.","pages":[247]},{"text":"Caution: anxiety may rise at first. One lab saw a statistically significant increase in anxiety in people's first week of regular meditation.","pages":[248]}],"tags":[{"text":"mindset"},{"text":"breathing"}],"when":[{"text":"morning"},{"text":"anytime"}],"schedule":[{"text":"Do a five-minute micro meditation in bed","pages":[247,248,249],"anchor":"wake","start_min":0,"end_min":5}]},{"id":"stress-05","number":5,"title":"Boost Your Morning Cortisol and Catecholamine Peak","page":250,"summary":{"text":"Stack three to four morning triggers—such as bright light, water and caffeine, exercise, and cold—to raise your morning cortisol and catecholamine peak. Then limit them at night. That buffers you against later-day stress.","pages":[250,258]},"why":[{"text":"Cortisol isn't just a stress hormone. Its main job is making sure you have enough energy (in the form of glucose) to meet the day's demands.","pages":[252]},{"text":"Night-time cortisol peaks—or morning cortisol that's too low or falls too slowly—flatten the curve. And that puts you into chronic stress.","pages":[254]},{"text":"In other words, start the day focused and ready, and you don't need to make more cortisol to face a later stressor. Researchers call this the CAR anticipation hypothesis.","pages":[258]},{"text":"There's a bonus, too: spiking cortisol in the morning also helps keep it low at night.","pages":[255]}],"steps":[{"text":"As soon as you can after waking, get bright light—ideally sunlight—into your eyes for about ten minutes. Up before sunrise? Wait for the sun, or use a 10,000 lux light.","pages":[250]},{"text":"In the first two hours of your day, drink 16–32 ounces of water and have 100–400 mg of caffeine (how much depends on your body weight and tolerance).","pages":[250]},{"text":"If your schedule allows, do cardio or resistance training within two to three hours of waking—sooner is better. If not, try 5–10 minutes of light movement.","pages":[250]},{"text":"Do one to three minutes of deliberate cold exposure (a cold shower works). Do it before resistance training—ideally not after.","pages":[251]},{"text":"Or try cyclic hyperventilation: 25–30 vigorous inhales through the nose with passive exhales through the mouth, then exhale fully and hold for 30–60 seconds. Repeat for two to three more rounds.","pages":[251]},{"text":"Consider low-dose licorice root with glycyrrhizin occasionally (1–2×/week; Huberman uses it 1–2×/month), or grapefruit, in the first 1–3 hours of your day. Talk to your doctor first.","pages":[251,257]},{"text":"At night, dim the lights and wind down. Skip eating or drinking much fluid in the 2–3 hours before sleep, and caffeine in the 8–10 hours before bed (elsewhere the book says 8).","pages":[254,258]}],"numbers":[{"text":"Bright light—ideally sunlight—as soon as you can after waking.","pages":[250],"label":"Morning light","value":"About 10 minutes"},{"text":"Drink it in the first two hours of your day.","pages":[250],"label":"Water","value":"16–32 ounces"},{"text":"How much depends on your body weight and caffeine tolerance.","pages":[250],"label":"Morning caffeine","value":"100–400 mg"},{"text":"If you drink caffeine in the afternoon: ~60 mg is about 3–4 oz of regular coffee, or one espresso shot.","pages":[258],"label":"Afternoon caffeine","value":"Decaf after 2 p.m./~60 mg"},{"text":"Simply viewing bright light can boost the morning cortisol peak by 50 percent.","pages":[255],"label":"Light effect","value":"Can boost peak 50%"}],"cautions":[{"text":"Caution: licorice root and grapefruit can be very potent. At high doses they can raise blood pressure and/or cause fluid retention, so use the minimal effective dose.","pages":[251]},{"text":"High blood pressure? Then no licorice root extract—daily glycyrrhizin can cause serious problems over time. Huberman suggests most people avoid it late in the day and at night.","pages":[257,258]},{"text":"Grapefruit can interact with medications, and high-dose licorice can affect how some drugs and potassium are metabolized—talk to your doctor. Doctors warn Cushing's syndrome patients to avoid both.","pages":[257]},{"text":"Never do cyclic hyperventilation before or during cold exposure, anywhere near water, while driving, or while operating machinery.","pages":[251]}],"tags":[{"text":"timing"},{"text":"light"},{"text":"movement"}],"when":[{"text":"morning"},{"text":"evening"}],"schedule":[{"text":"Hydrate and have your caffeine","pages":[250],"anchor":"wake","start_min":0,"end_min":120},{"text":"Exercise within 2–3 hours of waking","pages":[250],"anchor":"wake","start_min":0,"end_min":180},{"text":"No caffeine (8 h; elsewhere 8–10 h)","pages":[254,258],"anchor":"bed","start_min":-480,"end_min":0}]},{"id":"stress-06","number":6,"title":"Consider Specific Supplements to Help Offset Excessive Stress","page":260,"summary":{"text":"Four supplements—ashwagandha, L-theanine, phosphatidylserine and Rhodiola rosea—have shown some efficacy against parts of the stress response. They're for severe or prolonged stress, on top of your behavioral tools.","pages":[260]},"why":[{"text":"These supplements can raise parasympathetic and lower sympathetic activity, directly or indirectly. In other words, they tilt the seesaw the way that helps you.","pages":[261]},{"text":"Ashwagandha lowers cortisol, and that effect appears likely to be the major basis of how it lowers stress and anxiety.","pages":[262]},{"text":"L-theanine indirectly increases GABA (the brain's major inhibitory neurotransmitter) and dopamine.","pages":[264]},{"text":"The emerging picture: Rhodiola rosea buffers stress by calibrating how much adrenaline you release during high physical exertion and emotional stress.","pages":[267,268]}],"steps":[{"text":"Keep behavioral tools and sleep as your foundation. If sleep is lacking, no amount of pharmacology will help for long.","pages":[260]},{"text":"Talk to a physician first—to rule out dangerous interactions and make sure the product is reliable.","pages":[260]},{"text":"Try one supplement at a time. See how it works for you before you add another.","pages":[261]},{"text":"Ashwagandha: 200–300 mg, 1–2 times per 24 hours, in the afternoon and/or evening only. To start, Huberman suggests about 100–200 mg once daily, in the evening or an hour before bed.","pages":[260,263]},{"text":"L-theanine: 100 mg or 200 mg, 1–3 times a day. Take it with your caffeine if you drink caffeine regularly or are unusually stressed.","pages":[260]},{"text":"Phosphatidylserine: 400–800 mg once a day, any time after 4 p.m. Huberman suggests starting low—100–200 mg a few hours before bed.","pages":[260,266]},{"text":"Rhodiola rosea: 200 mg once or twice a day. Huberman also suggests taking it 30–60 minutes before a known stressor, or 100–120 mg three times daily during chronic-stress periods.","pages":[260,268]}],"numbers":[{"text":"Take it in the afternoon and/or evening only.","pages":[260],"label":"Ashwagandha","value":"200–300 mg, 1–2×/24 h"},{"text":"Take it with caffeine if you drink caffeine regularly or are under high stress.","pages":[260],"label":"L-theanine","value":"100 or 200 mg, 1–3×/day"},{"text":"Take it any time after 4:00 p.m.","pages":[260],"label":"Phosphatidylserine","value":"400–800 mg, once daily"},{"text":"Huberman also suggests 30–60 min before a known stressor, or 100–120 mg 3×/day during chronic stress.","pages":[260,268],"label":"Rhodiola rosea","value":"200 mg, 1–2×/day"}],"cautions":[{"text":"Caution: Huberman's limit for ashwagandha above 600 mg/day is a couple to a few weeks, then at least a few weeks off. One report: 950 mg daily for a year, then adrenal insufficiency.","pages":[262,263]},{"text":"Don't take Rhodiola rosea multiple times a day for over three to four weeks without at least a two-week break, Huberman advises. Use it short-term—not as a mainstay.","pages":[268]},{"text":"Have especially vivid dreams? Huberman warns against taking theanine (a note that comes with his sleep stack).","pages":[264]},{"text":"Be careful: herbal supplements are often fake or contaminated. Stick to major brands with third-party testing, especially for metals and purity.","pages":[263]}],"tags":[{"text":"supplements"}],"when":[{"text":"as-needed"}],"schedule":[]}]},{"key":"nutrition","name":"Nutrition","short":"Nutrition","color":"#8a7430","ink":"#fff6e8","intro":{"text":"Nutrition advice is noisy and contradictory. But the experts the book draws on agree on this much: for body weight, calories eaten versus calories burned matter. What’s offered here is the “Clean Omnivore Diet”—plenty of high CP:C ratio protein, vegetables, fruit, healthy fats and clean starches, with little highly processed food. It’s aimed at body composition, health, taste and budget.","pages":[270,272,273,292,293]},"protocols":[{"id":"nutrition-01","number":1,"title":"90 Percent or More of the Food You Eat Should Be Unprocessed or Minimally Processed","page":303,"summary":{"text":"Make at least 90 percent of what you eat unprocessed or minimally processed. That means single-ingredient whole foods, not packaged, multi-ingredient products (which tend to be high in sugar).","pages":[303,304]},"why":[{"text":"The data link processed foods to obesity, high blood pressure, heart disease, gut disorders, cancer and other serious illnesses.","pages":[304]},{"text":"Sugar works on you from the gut up. It activates gut cells that signal the brain via the vagus nerve, releasing dopamine—which can drive the urge to eat more of that food.","pages":[305]},{"text":"Manufacturers add sugar so we buy and eat more. Even chips can have it—as do most store-bought pasta sauces, salad dressings and condiments.","pages":[306]},{"text":"Processed foods make nutritious food seem less appealing. The good news? Your gut and brain can rewire so unprocessed foods taste better—and it doesn’t take long.","pages":[304]}],"steps":[{"text":"Cook and eat single-ingredient foods such as meat, poultry, fish, eggs, vegetables, fruit, rice, lentils, beans, oatmeal, pasta, olive or avocado oil. Butter’s fine in small portions; so are spices and salt.","pages":[303]},{"text":"Skip ready-to-eat and packaged multi-ingredient foods, and most pre-packaged sauces and condiments. Read nutrition labels—check for added sugar.","pages":[303]},{"text":"Keep nut butters to moderation. Trying to lose body fat? Then it’s best to skip them entirely.","pages":[303]},{"text":"Choose full-fat yogurt, cottage cheese and other dairy in plain flavors only. If you need taste, add a pinch of cinnamon, some fruit or a drizzle of honey.","pages":[303]},{"text":"Think you’re overdoing sugar? Try going without it for a set period—the book suggests one week. Expect a few days of stronger cravings first.","pages":[308]},{"text":"To curb sugar cravings, focus on high CP:C ratio protein at least three times a day. Add fiber from vegetables and from lower-sugar fruits, like berries and apples.","pages":[308]},{"text":"Crave chocolate? Try slowly developing a taste for raw cacao beans or 100 percent chocolate (not baking chocolate)—it has no sugar.","pages":[308]}],"numbers":[{"text":"The share of your food that should be unprocessed or minimally processed.","pages":[303],"label":"Unprocessed share","value":"90 percent or more"},{"text":"How long to go sugar-free if you think you’re overdoing it.","pages":[308],"label":"No-sugar trial","value":"One week"},{"text":"A suggested amount while you develop a taste for them to replace chocolate cravings.","pages":[308],"label":"Raw cacao beans","value":"Five or six per day"},{"text":"Dissolved in water. Really struggling with sugar cravings after cutting sugar out? This may be worth considering.","pages":[308],"label":"L-glutamine","value":"½ tbsp (3–5 g), 2–3× daily"}],"cautions":[{"text":"Fruit juices like orange juice are generally best avoided. They’re high in sugar with no fiber, so they spike your blood sugar quickly—then crash it.","pages":[307]},{"text":"Be careful with dried fruit—its sugar is concentrated. And some fruits, like grapes, contain more fructose than others.","pages":[307]},{"text":"There’s no single rule for sweeteners. They help some people lose weight but make others hungrier. And saccharin and sucralose may negatively impact the gut microbiome.","pages":[307]},{"text":"L-glutamine for cravings is a somewhat unconventional tool that needs more studies. Huberman’s support for it is anecdotal.","pages":[308]}],"tags":[{"text":"food"},{"text":"supplements"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"nutrition-02","number":2,"title":"Stay Hydrated","page":309,"summary":{"text":"Drink water deliberately. Start first thing on waking (18–24 oz in the instructions, 8–16 oz in a later passage), get about 80 oz over the first ten hours, and add extra during exercise.","pages":[309,310,312]},"why":[{"text":"Even slight dehydration can dull your concentration, alertness and short-term memory. And you can be dehydrated without feeling thirsty.","pages":[310,311]},{"text":"Drinking water can trigger the release of norepinephrine, which helps keep you focused and alert.","pages":[310]},{"text":"Timing matters. Your kidneys filter fluid best in the morning and daytime—peaking midafternoon, slowest around midnight. So front-loading water helps reduce night-time bathroom trips.","pages":[311,312]},{"text":"Hydration also helps prevent injuries, improves recovery and helps maintain body temperature during and after exercise.","pages":[310]}],"steps":[{"text":"Drink 18–24 ounces of water as soon as you wake—ideally before anything else, coffee and other caffeine included.","pages":[309]},{"text":"Aim for about 80 oz over the first ten hours; earlier is better. Prefer a simpler pace? A later passage says 8–16 oz on waking, then about every waking hour.","pages":[309,312]},{"text":"Avoid drinking a lot of water in the hours before bed. If you do drink in the evening, sip slowly—don’t gulp.","pages":[309,314]},{"text":"During exercise, drink your body weight in pounds divided by 30, in ounces, every 15–20 minutes. That’s the “Galpin Equation.”","pages":[309]},{"text":"Prefer no math? Get your 80 ounces in the first ten hours, then add 15–20 ounces per hour of exercise—drunk while you exercise.","pages":[313]},{"text":"In hot environments, add a few ounces every 15–20 minutes to the equation. Sweat a lot? You can increase it by 50–100 percent.","pages":[312,313]},{"text":"Sweating in warm conditions or a sauna? Add a pinch of sea salt (and a little lemon juice) to your water, or use an electrolyte product.","pages":[313]}],"numbers":[{"text":"The instructions say 18–24 oz first thing; a later passage says 8–16 oz on waking, then about hourly.","pages":[309,312],"label":"On waking","value":"18–24 oz (also 8–16 oz)"},{"text":"Your total water target across the first ten hours of the day.","pages":[309],"label":"First 10 hours","value":"About 80 oz (≈2.4 L)"},{"text":"Every 15–20 minutes of your workout. For example, 150 lb works out to 5 ounces.","pages":[309],"label":"During exercise","value":"Body weight (lb) ÷ 30 oz"},{"text":"What would be appropriate to drink for time spent in a hot sauna.","pages":[313],"label":"Hot sauna","value":"8–16 oz per 20–30 min"},{"text":"Drink this in addition if you have over two cups of strong coffee (over 200–400 mg caffeine) a day.","pages":[314],"label":"Heavy caffeine","value":"At least 80 oz, perhaps 100"}],"cautions":[{"text":"Don’t rely on clear urine or the skin-pinch test—they aren’t reliable guides to hydration. The book’s advice: simply drink enough water.","pages":[312,313]},{"text":"Waking once a night to urinate is normal. Still waking often? It could reflect a bladder or prostate issue, so talk to your doctor.","pages":[314]},{"text":"Caffeinated drinks count, but they act as diuretics and don’t hydrate as well as non-caffeinated drinks. Plain water still matters.","pages":[314]},{"text":"Shaky or lightheaded after coffee? That may mean low electrolytes—caffeine causes sodium loss. Huberman has seen water with a pinch of salt or electrolytes help many people.","pages":[314]}],"tags":[{"text":"drink"},{"text":"timing"}],"when":[{"text":"morning"},{"text":"daytime"}],"schedule":[{"text":"Drink water as soon as you wake","pages":[309,312],"anchor":"wake","start_min":0,"end_min":0},{"text":"Get in about 80 oz of water","pages":[309],"anchor":"wake","start_min":0,"end_min":600}]},{"id":"nutrition-03","number":3,"title":"Eat High CP:C Ratio Protein at Each Full Meal","page":316,"summary":{"text":"Make protein the cornerstone of your diet—specifically, foods high in complete protein per calorie. Aim for 30–50 grams per meal and about 1 gram per pound of body weight daily.","pages":[316]},"why":[{"text":"Complete proteins supply all nine essential amino acids—the ones your body can’t make. You use them for immune health, certain hormones, and building or keeping muscle.","pages":[317]},{"text":"Feeling satisfied is strongly linked to getting enough essential amino acids. Put simply, eat enough protein and overeating becomes less likely.","pages":[317,318]},{"text":"Leucine, an essential amino acid, raises a signaling pathway linked to mTOR—and that triggers your body to make muscle.","pages":[317,318]},{"text":"Most of your organs are made of proteins that get remade every few weeks to months. The essential amino acids are what make that possible.","pages":[317]}],"steps":[{"text":"Include 30–50 grams of high CP:C ratio protein at each meal or snack. Aim for about 1 gram per pound of body weight daily.","pages":[316]},{"text":"If you eat animal products, favor poultry, lean red meat, fish and shellfish. Eggs, whey, plain full-fat Greek yogurt and cottage cheese work too.","pages":[316]},{"text":"Plant-based? Complete options include beans and rice together, lentils, soy, seitan and quinoa—though their protein-to-calorie ratio is less favorable.","pages":[316]},{"text":"Don’t count nuts, nut butters or most cheeses as quality protein. If you do eat nut butter, keep it to a few tablespoons a week, made from nuts and salt only.","pages":[316]},{"text":"If you tend to overeat, start with your protein, then any starches, then your fibrous vegetables.","pages":[317]},{"text":"If 1 g/lb doesn’t feel right, pick protein foods without excess fat or preservatives. Still not working? Swap about a quarter of protein calories for clean starches and fibrous foods.","pages":[318]}],"numbers":[{"text":"High CP:C ratio protein at every meal or snack.","pages":[316],"label":"Per meal","value":"30–50 grams"},{"text":"Of body weight, each day.","pages":[316],"label":"Daily target","value":"About 1 g per lb"},{"text":"If you eat them at all—made from nuts and salt only.","pages":[316],"label":"Nut butter limit","value":"A few tablespoons a week"},{"text":"The share of protein calories to replace with clean starches and fibrous foods if 1 g/lb doesn’t suit you.","pages":[318],"label":"Protein swap","value":"About one fourth"}],"cautions":[{"text":"Eggs are great, but be aware: they have a relatively high calorie-to-protein ratio.","pages":[316]},{"text":"Be careful with nut butters: they’re mostly fat and calorie dense, and many on store shelves contain added sugar and/or seed oils.","pages":[316]},{"text":"When you adjust protein, keep overall calories roughly the same. Calories in, calories out is called a universal law of nutrition.","pages":[319]}],"tags":[{"text":"food"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"nutrition-04","number":4,"title":"Choose Fibrous Vegetables and (Some) Fruit as Your Major Sources of Carbohydrates","page":320,"summary":{"text":"After protein, build your diet on vegetables, then some fruit. They deliver vitamins, minerals, other micronutrients and fiber—aim for at least 35 grams of fiber daily for men, 25 for women.","pages":[320]},"why":[{"text":"You need all three types of fiber. Insoluble fiber aids stool formation, soluble fiber helps clear waste, and prebiotic fiber feeds beneficial gut bacteria.","pages":[321]},{"text":"Studies indicate fiber lowers the risk of metabolic syndrome. It’s also linked to lower heart disease risk and a reduced risk of several cancers.","pages":[321]},{"text":"Fiber helps you feel full and less tired. That’s because it adjusts how sugar and fat enter your blood after meals—and it blunts post-meal inflammation.","pages":[321]},{"text":"Vegetables supply magnesium, which you use for energy, bones, DNA, muscles, nerves and heartbeat. Yet most people don’t get enough.","pages":[322]}],"steps":[{"text":"Make vegetables the second major brick of your diet, after protein. Fruit is the third.","pages":[320]},{"text":"Men, get at least 35 grams of fiber a day. Women, at least 25 grams.","pages":[320]},{"text":"Consider filling half your lunch or dinner plate with vegetables. You might also add spinach and tomatoes to breakfast.","pages":[324]},{"text":"Slow down and chew your vegetables well, so they digest properly and you get their full benefits.","pages":[322]},{"text":"Fruit at the end of a meal upsets your digestion? Try eating it alone, before a meal, or as a snack.","pages":[322]},{"text":"Get your magnesium mainly from foods such as dark leafy greens, pumpkin seeds, almonds, black beans and soybeans.","pages":[323,324]}],"numbers":[{"text":"Your daily fiber goal, if you’re a man.","pages":[320],"label":"Fiber (men)","value":"At least 35 g/day"},{"text":"Your daily fiber goal, if you’re a woman.","pages":[320],"label":"Fiber (women)","value":"At least 25 g/day"},{"text":"Unless you’re very lean (men under 10%, women under 15% fat). The chapter intro says 2–4, depending on activity and calorie needs.","pages":[293,324],"label":"Fruit limit","value":"Probably ≤3 servings/day"},{"text":"What health authorities currently recommend for adults each day.","pages":[322],"label":"Magnesium (recommended)","value":"420 mg men, 320 mg women"},{"text":"Taken as L-threonate or bisglycinate, before sleep or with dinner, it may help adults reach the recommended amount. Talk to a physician first.","pages":[324],"label":"Magnesium supplement","value":"135 mg daily"}],"cautions":[{"text":"A sudden jump in fiber may temporarily cause gas and bloating. Once you eat enough fiber regularly, this usually stops being an issue.","pages":[321]},{"text":"Enjoy fruit, but don’t overdo it: despite its fiber and water, too much fruit can stimulate hunger.","pages":[324]},{"text":"The book suggests magnesium supplements as a sleep aid only if needed, after you’ve tried the other sleep protocols. Talk to a physician before adding any supplement.","pages":[324]},{"text":"Be careful with magnesium citrate: it can cause gastric distress and sometimes acts as a laxative.","pages":[324]}],"tags":[{"text":"food"},{"text":"supplements"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"nutrition-05","number":5,"title":"Consume Healthy Fats as Part of Most Meals and Snacks","page":325,"summary":{"text":"Include fat in most meals and snacks. Make it mostly unsaturated fats like olive oil and avocado, plus omega-3s—keeping saturated fat at 10 percent or less and total fat at about 30–35 percent.","pages":[325,328]},"why":[{"text":"Fat slows the rise of glucose in your bloodstream, and it increases satiety between meals.","pages":[326]},{"text":"Fatty acids help build cell membranes, regulate metabolism and influence hormones. Some are even directly involved in neuroplasticity.","pages":[326,327]},{"text":"Fat triggers gut-to-brain signals that bring a sense of fullness. And body fat releases leptin, which promotes fullness as well.","pages":[327]},{"text":"The catch with cutting out saturated fat: it can lead to eating more ultra-processed carbs and added sugar—which is also harmful.","pages":[328]}],"steps":[{"text":"Get most of your fat from unsaturated sources such as olives, avocados, olive oil and avocado oil.","pages":[325]},{"text":"Cook with olive oil and use it for salad dressing. Need a higher smoke point? Reach for avocado oil.","pages":[325]},{"text":"Get your omega-3 fats from fatty ocean fish like salmon (skin on), or from fish oil or krill supplements.","pages":[325]},{"text":"Ideally, favor monounsaturated fats—but include some saturated fat too, aiming for 10 percent or less of your diet.","pages":[328]},{"text":"Keep total fat around 30–35 percent of your diet. That helps you get its benefits without gaining weight.","pages":[328]},{"text":"Exercise day? Don’t raise your fat intake. If anything, increase clean starch to replace glycogen.","pages":[329]}],"numbers":[{"text":"As a share of your diet.","pages":[328],"label":"Saturated fat","value":"10 percent or less"},{"text":"Of your diet—for the benefits, without the weight gain.","pages":[328],"label":"Total fat","value":"About 30–35 percent"},{"text":"The limit health authorities set: 20 calories on a 2,000-calorie day.","pages":[328],"label":"Industrial trans fat","value":"≤1% of calories"}],"cautions":[{"text":"Caution: industrial trans fats (e.g. partially hydrogenated vegetable oil) harm cardiometabolic health. They’ve been banned in the US since 2018—check whether they’re used where you live or travel.","pages":[327,328]},{"text":"Be aware that saturated fats are hard to digest, which can leave you tired—and they can raise certain forms of cholesterol.","pages":[327]}],"tags":[{"text":"food"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"nutrition-06","number":6,"title":"Consume Low-Sugar Fermented Foods","page":330,"summary":{"text":"Eat two to four servings of low-sugar fermented foods a day—sauerkraut, kimchi or kefir, for example. They support a healthy gut microbiome and, through it, your body.","pages":[330]},"why":[{"text":"In a Stanford study, a fermented-food diet cut nineteen inflammation markers and raised gut microbial diversity more than a high-fiber diet did.","pages":[332,333]},{"text":"And those diversity gains stuck around even after participants returned to their own diets—what the researchers called “ecosystem remodeling.”","pages":[333]},{"text":"Diversity is generally the most important feature of a healthy gut microbiome. And diet plays a huge role in it.","pages":[332]},{"text":"The gut microbiome also appears to influence your mood and mental health, via the gut-brain axis.","pages":[331]}],"steps":[{"text":"Get two to four servings a day from foods like sauerkraut, kimchi, refrigerated brine pickles, kefir, low-sugar kombucha, miso and natto.","pages":[330]},{"text":"Look for fermented foods that need refrigeration and are low in sugar, with no added sugars.","pages":[333]},{"text":"Skip shelf-stable sauerkraut, pickles and the like—they haven’t been fermented.","pages":[333]},{"text":"On a budget? Try yogurt, apple cider vinegar or kefir. They’re cheaper and easy to find.","pages":[333]},{"text":"If you ferment at home, follow the recipe exactly—all advised precautions included.","pages":[333]}],"numbers":[{"text":"Servings of low-sugar fermented foods to get each day.","pages":[330],"label":"Daily servings","value":"Two to four"}],"cautions":[{"text":"Have kombucha in moderation—it’s often high in sugar and contains small amounts of alcohol.","pages":[333]},{"text":"Caution: home fermenting needs careful attention to avoid contamination with harmful bacteria, which can cause foodborne illness.","pages":[333]},{"text":"Fermented foods can trigger a histamine response (itchy eyes, tingling hands, brain fog). Huberman takes the enzyme DAO before such meals, which solved it for him.","pages":[334]}],"tags":[{"text":"food"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"nutrition-07","number":7,"title":"Consume Fatty Ocean Fish and/or Consider Omega-3 Supplements","page":335,"summary":{"text":"Your body can’t make omega-3s, so you need to get them in. Eat fatty cold-water fish once or twice a week and/or take omega-3 supplements, aiming for 1,000 mg of EPA daily.","pages":[335,336]},"why":[{"text":"The body can’t make omega-3 fatty acids. In other words, they have to come from your diet.","pages":[336]},{"text":"Research links omega-3s to memory, cognition, mental and heart health, better outcomes after heart disease treatment, and relief from depression.","pages":[336]},{"text":"In one study of major depression, 1,000 mg of EPA daily worked as well as 20 mg of fluoxetine—and combining them worked better than either alone.","pages":[336]}],"steps":[{"text":"Once or twice a week, eat some fatty cold-water fish. Consider salmon with the skin on, sardines, mackerel or herring.","pages":[335]},{"text":"Take fish oil or krill oil supplements (algae oil if you’re vegan), aiming for 1,000 mg of EPA a day.","pages":[335]},{"text":"Make sure your supplements are fresh and come from a reputable, third-party tested company.","pages":[337]},{"text":"For best value, consider liquid fish oil in dark bottles. Refrigerate it after opening so it doesn’t go rancid.","pages":[337]},{"text":"Some people may want to ask their doctor about a prescription, purified, high-dose omega-3 capsule—now inexpensive as a generic.","pages":[335,337]},{"text":"Lean toward low-mercury, inexpensive cold-water fish—sardines and herring, for example.","pages":[337]}],"numbers":[{"text":"How often to eat fatty, cold-water fish.","pages":[335],"label":"Fatty fish","value":"Once or twice a week"},{"text":"That’s 1 gram of EPA a day, which will suffice for most people.","pages":[335],"label":"EPA (most people)","value":"1,000 mg per day"},{"text":"Some people will benefit from going this high.","pages":[335],"label":"EPA (some people)","value":"2–3 grams per day"},{"text":"Omega-3 content of the prescription option Huberman takes.","pages":[335],"label":"Prescription capsule","value":"465 mg per capsule"}],"cautions":[{"text":"Fish oil supplements can turn rancid. Buy fresh, and keep liquid oil refrigerated once it’s open.","pages":[337]},{"text":"Caution: some people who tolerate fish oil—Huberman included—get an itchy rash from krill-based omega-3. Proceed carefully.","pages":[337]},{"text":"Watch the mercury: king mackerel, swordfish and bigeye tuna are among the highest, and many species are too high to eat frequently.","pages":[337]},{"text":"Note that the prescription omega-3 option requires a doctor’s prescription.","pages":[337]}],"tags":[{"text":"food"},{"text":"supplements"}],"when":[{"text":"anytime"}],"schedule":[]}]},{"key":"light","name":"Light","short":"Light","color":"#e6b422","ink":"#1b1b1b","intro":{"text":"Light is a key lever for your health—every bit as crucial as sleep, exercise, or nutrition. Like any medicine, its effects hinge on type, intensity, duration, and timing. So the goal is simple: know which light to seek, which to limit, and when.","pages":[340,341]},"protocols":[{"id":"light-01","number":1,"title":"View Bright Light in the First Hour After Waking to (Further) Increase Your Morning Cortisol Levels","page":347,"summary":{"text":"Get bright light in your eyes in the first hour after waking—sunlight, or a 10,000 lux light if the sun isn't up. It boosts morning cortisol, which pays off in energy, mood, focus, and sleep.","pages":[347]},"why":[{"text":"Your SCN (your brain's master clock) can trigger a big cortisol rise only in the first 60 minutes after waking. That window is narrow. Miss it, and it's gone until the next day.","pages":[351]},{"text":"Cortisol isn't only a stress hormone. Put simply, it releases stored fuel—shifting your brain and body out of sleep and into physical and mental readiness.","pages":[351]},{"text":"Morning light does double duty. It boosts morning cortisol and helps keep nighttime cortisol low, kicking off a feedback loop so your levels fall toward afternoon and evening.","pages":[353,354]},{"text":"And the payoff is quick: benefits like better mood, focus, and energy can be felt within minutes, and they last all day.","pages":[353]}],"steps":[{"text":"Get sunlight in your eyes as soon as you can after waking. Normally wake at noon? This still applies.","pages":[347,348]},{"text":"Sun not up yet, or can't get to it? Sit about 1–2 feet from a 10,000 lux light for at least 10 minutes total in the first hour.","pages":[347,350]},{"text":"Used a 10,000 lux light first? Still aim for about 5–20 minutes of natural sunlight once the sun comes out.","pages":[349]},{"text":"Go outside—don't do this through a window. Most window glass filters out too much of the light you need.","pages":[348]},{"text":"It's best to skip sunglasses, and skip the brimmed hat too. Eyeglasses or contacts are fine, even with UV protection.","pages":[348]},{"text":"Blink as needed. If the light is hard to take, squint and look at the area next to the sun.","pages":[348]},{"text":"If you like, make it an outdoor walk, run, or yoga session—sunlight and exercise can work together to raise morning cortisol.","pages":[349]}],"numbers":[{"text":"Can only grab five minutes? Do it anyway—some is better than none.","pages":[347],"label":"General rule","value":"10–30 minutes"},{"text":"Your minimum on a clear morning.","pages":[349],"label":"Clear morning","value":"Minimum 10 minutes"},{"text":"Your minimum when it's partly cloudy.","pages":[349],"label":"Partly cloudy","value":"Minimum 20 minutes"},{"text":"Morning sunlight on a very overcast day. Used a 10,000 lux light beforehand? That cuts the sunlight time you need by about half.","pages":[349],"label":"Very overcast","value":"30 minutes"},{"text":"Give it at least 10 minutes total within your first hour awake.","pages":[350],"label":"Light box","value":"10,000 lux, 1–2 feet away"}],"cautions":[{"text":"Caution: don't force yourself to stare at the sun or any bright light—doing so can damage your eyes. This shouldn't hurt.","pages":[348]},{"text":"Don't keep your eyes on your phone the whole time. That negates the effect.","pages":[349]},{"text":"Phone and computer screens are too dim to stand in for morning light—yet bright enough at night to raise cortisol and suppress melatonin.","pages":[350]},{"text":"People vary in light sensitivity; some feel too awake after 10 minutes of 10,000 lux light. And remember, a light box doesn't replace sunlight.","pages":[350]}],"tags":[{"text":"light"},{"text":"timing"}],"when":[{"text":"morning"}],"schedule":[{"text":"Get bright light (sun or 10,000 lux)","pages":[348],"anchor":"wake","start_min":0,"end_min":60}]},{"id":"light-02","number":2,"title":"View Sunlight in the Late Afternoon and/or Early Evening to Help Buffer Against Negative Effects of Artificial Light at Night","page":357,"summary":{"text":"In the afternoon and early evening, view sunlight for 5–30 minutes. This helps offset the melatonin-suppressing effects of bright artificial light at night.","pages":[357,358]},"why":[{"text":"Bright light powerfully suppresses melatonin, and short-wavelength sources like LEDs and screens are especially potent. In fact, under 30 seconds of bright LED light can significantly lower it.","pages":[358]},{"text":"Low-angle sunlight carries less UV and fewer short wavelengths. Its longer wavelengths help signal to your brain that night is coming—time to prepare for sleep.","pages":[358]},{"text":"Good news: small studies found bright daytime or early evening light partially protected against light-induced melatonin loss at night.","pages":[359]}],"steps":[{"text":"At some point between the sun being directly overhead and sunset, head outside and view sunlight for 5–30 minutes.","pages":[357,358]},{"text":"Lose the sunglasses—eyeglasses and contacts are fine—and face the setting sun.","pages":[357]},{"text":"Skip the brimmed hat, don't stare at the sun, and blink as needed.","pages":[357]},{"text":"Stuck in the office? Try a walk toward the sun, or pause facing it for a few phone-free minutes before you leave work.","pages":[360]}],"numbers":[{"text":"That's your afternoon and early-evening sunlight dose.","pages":[357],"label":"Duration","value":"5–30 minutes"},{"text":"Taken from the book's day-phase guide in Light Protocol 3. This protocol itself says the timing needn't be precise.","pages":[358,362],"label":"Timing","value":"6–10 hours after waking"},{"text":"Bright LED light to your eyes for this short a time can significantly reduce melatonin.","pages":[358],"label":"LED melatonin hit","value":"Under 30 seconds"}],"cautions":[{"text":"Don't swap late afternoon or evening sunlight for a 10,000 lux light. It's too bright, and its wavelengths can disrupt your sleep-wake cycle.","pages":[357]},{"text":"Teens: it may be especially important to avoid bright light at night. In one study, early evening sun didn't protect adolescents the way it did adults.","pages":[359]},{"text":"An occasional bright light before sleep is no cause for concern. But a habit of bright lights late at night could be why your moods worsen.","pages":[360]}],"tags":[{"text":"light"},{"text":"timing"}],"when":[{"text":"afternoon"},{"text":"evening"}],"schedule":[{"text":"Get late-afternoon or early-evening sunlight","pages":[362],"anchor":"wake","start_min":360,"end_min":600}]},{"id":"light-03","number":3,"title":"Avoid Viewing Bright Light One Hour Before Your Bedtime","page":361,"summary":{"text":"From one hour before bed until you wake, use only as much artificial light as you need—and especially avoid bright short-wavelength light. That protects your sleep and your overall health.","pages":[361,369]},"why":[{"text":"In the last hour before bed, very little bright light is needed to wake you up. And bright light at any time strongly inhibits melatonin. That's a double whammy.","pages":[361]},{"text":"It's not only blue-looking lights. Bright white LEDs, fluorescent lights, and screens give off many short wavelengths—the ones that stimulate cortisol and inhibit melatonin.","pages":[361]},{"text":"The eye neurons that signal daytime look at your upper visual field (meaning the sky outdoors and the ceiling indoors). That's why overhead lights matter.","pages":[365,366]},{"text":"This is about more than sleep. In a study of 88,905 people, those with the most light at night had up to a 34% higher risk of death from any cause.","pages":[368]}],"steps":[{"text":"In the hour before bed, use only as much artificial light as you need to do your nighttime activities safely. Then keep it that way until morning.","pages":[361]},{"text":"About 10–14 hours after waking, start dimming the lights and avoid bright light to your eyes.","pages":[362]},{"text":"In the final hours before sleep, use desk or floor lamps instead of overhead lights, if possible.","pages":[365]},{"text":"Want to go further? Use bulbs without short wavelengths (they look yellow-orange) or bulbs that emit only long wavelengths (they look red).","pages":[366]},{"text":"Can't avoid bright short-wavelength light? Consider lenses that block all short wavelengths—not simply \"blue blockers.\"","pages":[361,366]},{"text":"Moonlight or firelight? Don't worry about them. They won't stimulate your brain's wakefulness pathways.","pages":[367]}],"numbers":[{"text":"From this point until you wake, use only the artificial light you need.","pages":[361],"label":"Low-light window","value":"1 hour before bed"},{"text":"Start dimming here, and keep bright light out of your eyes.","pages":[362],"label":"Start dimming","value":"10–14 hours after waking"},{"text":"That's why bright moonlight isn't a concern.","pages":[367],"label":"Full moon","value":"Less than 1 lux"},{"text":"Even a light this dim, left on while you sleep, can alter your glucose the next morning.","pages":[367],"label":"Light during sleep","value":"100 lux overhead"},{"text":"In this window, keep lights dim, off the ceiling, and free of short wavelengths. The protocol's core rule is one hour.","pages":[366],"label":"Dim, low lights","value":"1–2 hours before bed"}],"cautions":[{"text":"Caution: don't wear short-wavelength-blocking glasses while driving. They make blue or green things much harder to see—or even invisible.","pages":[366]},{"text":"If you use candles or a fire, make sure the flames are out when you're finished, and be careful not to start a fire.","pages":[367]},{"text":"Red evening bulbs are not red light therapy. That's a different thing altogether.","pages":[366]}],"tags":[{"text":"light"},{"text":"environment"},{"text":"timing"}],"when":[{"text":"bedtime"}],"schedule":[{"text":"Begin dimming your lights","pages":[362],"anchor":"wake","start_min":600,"end_min":840},{"text":"Only the light you need, until morning","pages":[361],"anchor":"bed","start_min":-60,"end_min":0},{"text":"Dim, low lights—no short wavelengths","pages":[366],"anchor":"bed","start_min":-120,"end_min":0}]},{"id":"light-04","number":4,"title":"Expose Your Upper and Lower Body Skin to Sunlight During the Day","page":370,"summary":{"text":"Get 20–30 minutes of outdoor sunlight on your skin at least three times a week—ideally every day. Nothing substitutes for sunlight, but avoid sunburn at all costs.","pages":[370,373]},"why":[{"text":"Sunlight's UV triggers your skin to make vitamin D. And your body evolved to use sun-made vitamin D in ways supplements may not mimic.","pages":[371]},{"text":"In one study, people reported more romantic interest after time in the sun—and sun exposure was linked to higher testosterone in both men and women.","pages":[372]},{"text":"Sunlight's longer wavelengths help \"charge\" your mitochondria, making them better at producing ATP (cellular energy). They also help offset damaging reactive oxygen species.","pages":[374]},{"text":"A Swedish study of 29,518 women linked more sun exposure to a lower risk of death from all causes. Other factors, like fresh air and movement, likely play a role too.","pages":[374]}],"steps":[{"text":"Get 20–30 minutes of outdoor sun on your skin at least three times a week—and ideally every day.","pages":[370]},{"text":"Wear the least clothing that's comfortable and suits your setting (say, shorts and a tank top), without covering your whole body. Ideally, skip the hat.","pages":[370]},{"text":"Before spending a lot of time in the sun, check the UV index. It tells you when to be careful about excess UV.","pages":[374]},{"text":"When UV is high, Huberman covers up (hat, long sleeves) or uses a mineral sunscreen whose only active ingredient is zinc oxide (not nano zinc).","pages":[373]},{"text":"Cold or gloomy day? Get outside anyway. If you stay covered up, skip the brimmed hat so more sun reaches your face and eyes.","pages":[376]},{"text":"Brighten your indoor space with sunlight if you can. Getting a lot of conventional LED light? Consider switching to full spectrum LEDs.","pages":[376]},{"text":"If you live where you can't get much sun on your skin for many days a year, get a 10,000 lux light and a red and IR incandescent light.","pages":[377]}],"numbers":[{"text":"That's the protocol's main instruction for outdoor sunlight on your skin.","pages":[370],"label":"Duration","value":"20–30 minutes"},{"text":"That's how often to get sun on your skin.","pages":[370],"label":"Frequency","value":"3+ times/week, ideally daily"},{"text":"The bottom line the protocol closes on: at least 30 minutes a day, as many days a week as possible.","pages":[376],"label":"Simple takeaway","value":"30+ minutes/day, most days"}],"cautions":[{"text":"Caution: avoid sunburn at all costs. Excess UV causes sunburn, raises the risk of certain skin cancers, and speeds up skin aging.","pages":[373]},{"text":"Your own risk of sunburn and skin cancer depends on factors such as skin tone and inherited susceptibility.","pages":[373]},{"text":"Indoor lights and 10,000 lux lights can fill in on days you can't get enough sunlight—but they shouldn't replace it every day.","pages":[370]},{"text":"Don't count sunlight through a window. It's not the same as going outside.","pages":[376]}],"tags":[{"text":"light"}],"when":[{"text":"daytime"}],"schedule":[]},{"id":"light-05","number":5,"title":"Expose Your Skin and Eyes to Long Wavelength Light (Red, Near-IR, and Infrared)","page":378,"summary":{"text":"Use a long-wavelength (red, near-IR, IR) light device for 10–30 minutes, 3–7 days a week. Light up as much skin, face, and head as you can—mainly to promote mitochondrial health.","pages":[378,379]},"why":[{"text":"The key is an enzyme in your mitochondria. When it absorbs long wavelength light, that helps them make ATP (cellular energy)—through at least two proposed mechanisms.","pages":[380]},{"text":"It can also promote youthful-looking skin, reduce acne, and speed wound healing.","pages":[381]},{"text":"In one study, 15 minutes of 670 nm light on the back lowered glucose after a sugary drink by 27.7% versus controls.","pages":[382]},{"text":"In studies, viewing 670 nm red light improved vision in people around 40 and older. In one, the benefit showed up only when the light was seen in the morning.","pages":[383]}],"steps":[{"text":"Use a long-wavelength light (LWL) device for 10–30 minutes, 3–7 days a week.","pages":[378]},{"text":"For general health, light up as much skin, face, and head as you can. The most impressive effects generally come from whole-body exposure on both sides.","pages":[378,379]},{"text":"For your eyes: within three hours of waking, expose your face to a concentrated red light (not a laser) for 5–10 minutes, once or twice a week.","pages":[384]},{"text":"Keep the light at a comfortable distance. Closing your eyes is fine—the light passes through eyelids—but don't wear dark occluding glasses.","pages":[384]},{"text":"The sun is a free source. Near sunrise and sunset, UV is less of an issue; at other times, check the UV index and avoid excess UV.","pages":[385]},{"text":"Pick a device that emits only long wavelength light, about 600 nm or longer. Generally, the broader its range of long wavelengths, the better.","pages":[386]},{"text":"Favor devices that feel warm on your skin at the distance you use them—they're more effective.","pages":[386]}],"numbers":[{"text":"Your general long wavelength light sessions for skin, face, and head.","pages":[378],"label":"Device use","value":"10–30 min, 3–7 days/week"},{"text":"Red light to the face within three hours of waking. Later, the book says within one to three hours.","pages":[384],"label":"Eye protocol","value":"5–10 min, 1–2×/week"},{"text":"The most effective devices give off red, near-IR, and IR light (600–850+ nm).","pages":[386],"label":"Wavelength","value":"About 600 nm or longer"},{"text":"That's how far long wavelength light can scatter once it's inside your body.","pages":[379],"label":"Penetration","value":"Up to 8 centimeters"},{"text":"Anywhere from small handheld units to full body panels and red light beds.","pages":[385],"label":"Device cost","value":"$500 to over $100,000"}],"cautions":[{"text":"Don't rely on this as your only way to treat or prevent vision loss. Get an eye exam every year, plus a yearly glaucoma pressure check.","pages":[384]},{"text":"Note: vision benefits appeared only in people 40 and older, and only when done within one to three hours of waking.","pages":[384]},{"text":"Caution: never force a stare at the sun. Blink as needed, or close your eyes.","pages":[385]},{"text":"Huberman doesn't recommend lasers for home use. Using low-level laser therapy for skin issues like wounds or acne? Consult a physician.","pages":[386]}],"tags":[{"text":"light"}],"when":[{"text":"morning"},{"text":"anytime"}],"schedule":[{"text":"Red light to your face (for eyes)","pages":[384],"anchor":"wake","start_min":0,"end_min":180}]}]},{"key":"learning","name":"Focus, Motivation, and Learning","short":"Learning","color":"#2b2b2e","ink":"#f3efe6","intro":{"text":"Motivation, focus, and learning are states of your mind and body—with neural and hormonal underpinnings—and you can learn to access them on purpose. Learning-driven brain rewiring (self-directed adaptive plasticity, or SDAP) follows six steps in a fixed order: get alert, get and stay focused, keep a state of urgency, embrace errors, rest, and repeat. The key is the sequence. Following the steps in order matters more than any single tool.","pages":[389,391,398,400]},"protocols":[{"id":"learning-01","number":1,"title":"Shift into a State of Alertness and Focus","page":401,"summary":{"text":"The first SDAP step: get into a state of raised (sympathetic) arousal—alert, but not stressed. Foundational, behavioral, and pharmacological tools can all get you there.","pages":[401,409]},"why":[{"text":"Arousal and learning follow an inverted U. Too little arousal and learning doesn't happen; too much and it doesn't happen either. The sweet spot is alert but calm.","pages":[405]},{"text":"Here's the key: learning-related brain plasticity happens only in the circuits tied to where your attention is placed.","pages":[407]},{"text":"Apparently, a phone within reach makes your brain spend mental energy resisting picking it up—even if you aren't thinking about it or seeing notifications.","pages":[439,440]},{"text":"The foundational tools (sleep, NSDR, stress control, nutrition) are the bedrock. Skip them, and the other focus tools work far less well.","pages":[409]}],"steps":[{"text":"Want the most focus? Put your smartphone in a completely different room from where you're working.","pages":[440]},{"text":"Slept poorly but want to lock in on a learning bout? Consider 10, 20, or (if possible) 30 minutes of NSDR sometime beforehand.","pages":[409]},{"text":"Short on time? Right after waking—still in bed, eyes closed—focus on ten slow breaths. Mind wanders before ten? Start over at one.","pages":[413]},{"text":"Try 40 Hz binaural beats on headphones for five minutes before a learning bout or work session. If that works for you, try listening throughout.","pages":[416]},{"text":"Use brief HIIT for focus. Huberman's version: after a 5–10 minute warm-up, do eight rounds of a 30-second near-all-out sprint and 30 seconds of rest.","pages":[418]},{"text":"For quick alertness, take 10–20 big belly-breath inhales through your nose and let the air fall out of your mouth. Alert after ten? Stop. If not, do ten more.","pages":[421,422]},{"text":"Try 30 seconds to 3 minutes of deliberate cold exposure—uncomfortably cold for you, but safe and not painful. Then shower and start your learning bout.","pages":[423]}],"numbers":[{"text":"Sit or lie down, close your eyes, and keep bringing your attention back to the spot between your eyes and/or your breathing.","pages":[411],"label":"Meditation","value":"About 10–20 minutes"},{"text":"Suggested to try alongside caffeine; it can heighten focus. Don't jump from none to caffeine, theanine, and alpha-GPC all at once.","pages":[425,427],"label":"Theanine","value":"100 mg with caffeine"},{"text":"Considered safe for adults without anxiety, depending on weight and tolerance. Not a regular user? An extra 100–250 mg may make focusing hard.","pages":[424,425],"label":"Caffeine safe range","value":"100–400 mg"},{"text":"You can try it about 30 minutes before late-afternoon or night work. Limit it to 2–4 times per week.","pages":[426,427],"label":"Alpha-GPC","value":"300–600 mg"},{"text":"Taking alpha-GPC? Take this within the same 24 hours to help offset the TMAO rise it can cause.","pages":[427],"label":"Garlic extract","value":"600 mg"}],"cautions":[{"text":"Caution: never do cyclic hyperventilation in or near water, or while driving. With low CO2, your urge to breathe is delayed.","pages":[422]},{"text":"Nicotine is highly addictive and raises blood pressure. If you use it, stick to the lowest effective dose—6 mg per use at most, only 2–3 (elsewhere 2–4) times a week.","pages":[403,431,433]},{"text":"Under 18? You're advised to avoid energy drinks and pre-workout formulas.","pages":[429]},{"text":"Be careful: stimulants taken when you're very sleep-deprived set you up for cardiac issues. If you take a prescription focus drug, don't stop suddenly—talk to your doctor.","pages":[427,437]}],"tags":[{"text":"breathing"},{"text":"movement"},{"text":"supplements"}],"when":[{"text":"as-needed"},{"text":"morning"}],"schedule":[{"text":"Do ten slow breaths in bed","pages":[413],"anchor":"wake","start_min":0,"end_min":0}]},{"id":"learning-02","number":2,"title":"Use Mental Contrasting to Achieve a “State of Urgency” and Reach Your Goals","page":441,"summary":{"text":"Aim for a 'state of urgency' rather than motivation. You create it with mental contrasting (WOOP): imagining your goals, and the obstacles in your way, in a structured way.","pages":[441]},"why":[{"text":"Contrasting the goal with its obstacles generates heightened physical and mental energy. That makes you more likely to start—and to keep going.","pages":[446]},{"text":"A state of urgency triggers catecholamine release, raising sympathetic tone and focus. Better performance then builds more urgency. In other words, it's a positive feedback loop.","pages":[444]},{"text":"Put simply, motivation gets you to try; a state of urgency is what keeps you practicing.","pages":[444]}],"steps":[{"text":"Wish: name your big, overall goal. Give it some detail—the skills, credentials, or proficiencies you want—rather than something vague like 'be happy.'","pages":[446]},{"text":"Outcome: think about how you want to feel once you've achieved the goal. This step is aspirational, so let yourself daydream freely.","pages":[446,447]},{"text":"Obstacles: get hyperrealistic about the roadblocks you expect. Include how you'll feel—and be honest about your reaction when things don't go to plan.","pages":[447]},{"text":"Plan: write if-then statements that tackle the obstacles you expect. These are your action steps.","pages":[448]},{"text":"Write your answers down or record them on your phone. You can do WOOP in your head, but it works best recorded.","pages":[446]}],"numbers":[{"text":"Do it up front. It costs nothing.","pages":[449],"label":"Time needed","value":"About 10 minutes"}],"cautions":[{"text":"Careful: too much positive thinking about goal outcomes undermines performance.","pages":[445]},{"text":"Focusing too much on the challenges ahead also keeps people from pursuing goals, at least in the long run. The point is the contrast: you need both.","pages":[445,446]}],"tags":[{"text":"mindset"}],"when":[{"text":"as-needed"}],"schedule":[]},{"id":"learning-03","number":3,"title":"Embrace Errors to Improve Your Performance","page":452,"summary":{"text":"Errors from genuine attempts to learn are the signal for plasticity. So practice at a difficulty just slightly beyond your current ability, and use your mistakes to learn.","pages":[452]},"why":[{"text":"If you can already do something well, your nervous system won't change. That's because the gap between your current ability and your target is what triggers learning.","pages":[452]},{"text":"Errors activate your cerebellum, which compares what you're trying to do with what you're actually doing. The bigger the error, the bigger the response.","pages":[455]},{"text":"The moments right after a mistake are critical. The arousal that follows sticks around for a while, priming you for focus and plasticity.","pages":[457]}],"steps":[{"text":"Work just slightly beyond your current ability. Studies show the right difficulty yields an error rate of 15–30%.","pages":[452]},{"text":"Push past what you think you can do, and use your mistakes as learning tools.","pages":[452]},{"text":"Pick a level where you succeed much of the time—yet still fail some of the time.","pages":[457]},{"text":"Teach? Consider saving verbal feedback for when students think they got something right but didn't. Otherwise, let them register their own errors.","pages":[457]}],"numbers":[{"text":"That's the level that tends to work best for learning motor skills.","pages":[452],"label":"Motor skills","value":"30% error rate"},{"text":"Shoot for about this level with cognitive skills.","pages":[452],"label":"Cognitive skills","value":"About 15% error rate"},{"text":"A 2019 modeling study found that training progressed much faster at this level of accuracy.","pages":[456],"label":"Accuracy (study)","value":"About 85%"}],"cautions":[{"text":"Don't make mistakes on purpose—deliberate errors won't have the same effect.","pages":[452]},{"text":"Too hard backfires. In a modeling (simulation) study, when 50% of attempts failed, the brain couldn't seem to capture the right strategy for rewiring.","pages":[456]},{"text":"The 15% figure is approximate. No need to obsess over hitting an exact error rate.","pages":[457]}],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"learning-04","number":4,"title":"Prioritize Sleep the Night After a Learning Bout","page":459,"summary":{"text":"On the night after a learning bout, get adequate sleep. That's when the rewiring actually happens. NSDR after a learning bout can also enhance plasticity.","pages":[459]},"why":[{"text":"During sleep, your brain rapidly replays what you tried to learn that day—using the same firing sequences—including which errors to avoid.","pages":[459]},{"text":"If brain activity patterns during sleep get disrupted, you don't learn as well.","pages":[459]},{"text":"Evidence points to REM sleep on the first night after learning as most crucial—though for some skills, deep slow-wave sleep may matter more.","pages":[459]},{"text":"Sleep is also when your brain builds schemas: common themes pulled from movements or ideas that let it store information more efficiently.","pages":[459]}],"steps":[{"text":"The night after a learning bout, get adequate sleep.","pages":[459]},{"text":"At any point after a learning bout, do 10–30 minutes of NSDR to enhance plasticity.","pages":[459]},{"text":"Do your best to get adequate sleep (for you) every night—especially while you're working to master new information and skills.","pages":[460]},{"text":"Had a poor night's sleep? The next morning, do NSDR. Then get your sleep schedule back on track that night.","pages":[460]}],"numbers":[{"text":"Any time after a learning bout, to enhance plasticity.","pages":[459],"label":"NSDR after","value":"10–30 minutes"}],"cautions":[{"text":"If you sleep poorly, don't make it worse by fretting over the learning you lost.","pages":[460]}],"tags":[{"text":"rest"}],"when":[{"text":"bedtime"},{"text":"anytime"}],"schedule":[]},{"id":"learning-05","number":5,"title":"Incorporate Micro Rests into Your Learning Bouts","page":461,"summary":{"text":"While practicing a new motor or cognitive skill, pause now and then between repetitions. These short waking 'micro rests' have been shown to accelerate learning.","pages":[461]},"why":[{"text":"During micro rests, your brain replays the firing pattern of what you're learning 10–20 times faster. In other words, it increases your repetition density.","pages":[461,462]},{"text":"Spacing out repetitions was observed to deliver faster, more stable learning than continuous repetition.","pages":[462]},{"text":"This wakeful consolidation seems to let you fit the new motor sequence together with sequences you learned before.","pages":[462]}],"steps":[{"text":"For motor skills, take short breaks of 5–30 seconds during the learning bout—and do nothing at all during them.","pages":[461]},{"text":"Learning something cognitive? Take short breaks of 5–10 minutes during the learning bout.","pages":[461]},{"text":"Start with continuous reps. Once errors begin, pause every third or fifth trial, go back to continuous reps, then pause after every error, every other, or every third.","pages":[463]},{"text":"Take micro rests somewhat at random. If you want, set a chime to go off at random intervals.","pages":[463]},{"text":"During a rest, you can just sit, draw a little, walk around, or use the bathroom. Just stay off your phone, web browser, and email.","pages":[463]}],"numbers":[{"text":"Do-nothing breaks during motor learning. The book also cites 10–30 seconds as shown to improve skills.","pages":[461,463],"label":"Motor rest","value":"5–30 seconds"},{"text":"Your short breaks during a cognitive learning bout.","pages":[461],"label":"Cognitive rest","value":"5–10 minutes"},{"text":"That's how much faster the learning-related firing pattern replays during micro rests.","pages":[461],"label":"Replay speed","value":"10–20 times faster"}],"cautions":[{"text":"Don't check your phone during the breaks. The rest should mean doing nothing at all.","pages":[461]},{"text":"Don't obsess over exact rest length. For motor practice, simply pausing 5–10 seconds is the key—and a bit longer (15–20 seconds) is not a problem.","pages":[463]}],"tags":[{"text":"rest"}],"when":[{"text":"anytime"}],"schedule":[]},{"id":"learning-06","number":6,"title":"Increase Retention of New Skills and Information with Mental Rehearsal","page":464,"summary":{"text":"The final SDAP step: after a learning bout, take a few minutes to reflect and test yourself on what you do and don't remember or understand. That protects new learning from being forgotten.","pages":[464,465]},"why":[{"text":"Memories and new skills fade fast—within days to weeks—unless rehearsal locks them in. The exception: very emotionally charged events.","pages":[465]},{"text":"It turns out self-testing is the best form of rehearsal for protecting newly learned skills and information from being forgotten.","pages":[465]},{"text":"In a classic 2006 study, reading once plus later mental reflection was far better for retention and comprehension than reading again and again.","pages":[465]}],"steps":[{"text":"At some point once a learning bout is over, take 1–5 minutes to reflect on what you read or did.","pages":[464]},{"text":"Test yourself: What do you remember, and what not? What do you understand, and what not?","pages":[464]},{"text":"For cognitive skills and new information, self-test informally as a mental exercise—or formally, by having a friend or an AI quiz you on the same material.","pages":[464]},{"text":"For motor skills, think back to where you were challenged and made errors.","pages":[464]},{"text":"Spend a few minutes testing your recall or physical skill by yourself. Try to find the point where your ability drops off.","pages":[466]},{"text":"Underline or highlight? Then later, write down what you marked. Highlighting only helps you remember if you do this.","pages":[465]}],"numbers":[{"text":"At some point once the bout is over.","pages":[464],"label":"Reflection","value":"1–5 minutes"},{"text":"That's how quickly memories and new skills fade unless rehearsal locks them in.","pages":[465],"label":"Forgetting","value":"Days to weeks"}],"cautions":[],"tags":[{"text":"mindset"}],"when":[{"text":"anytime"}],"schedule":[]}]},{"key":"growth","name":"Personal Growth","short":"Personal Growth","color":"#b9a0c6","ink":"#1b1b1b","intro":{"text":"Your quality of life is strongly driven by your emotional life and your relationships—with others and with yourself, meaning how you talk to and think about yourself. Thoughts are simulations your brain runs. They compete with each other, follow from your perceptions, and, yes, can be controlled. Ahead: a science-supported tool, ways to balance outward roles with being true to yourself, and a way to resolve inner conflicts from unresolved pain.","pages":[468,469,471,472]},"protocols":[{"id":"growth-01","number":1,"title":"Replace Mind Wandering with Present-Tethered Awareness","page":474,"summary":{"text":"Check in through the day: are your thoughts on the present? If not, bring them back with simple questions about your surroundings. Being focused on the present is tied to being happier.","pages":[474,477]},"why":[{"text":"In Killingsworth and Gilbert's study, people were happier when focused on what they were doing and their immediate surroundings—even during boring or unpleasant activities.","pages":[476]},{"text":"The point is, for happiness, mind wandering mattered more than the activity itself. Being present in a less enjoyable task seemed better than daydreaming about pleasant things.","pages":[476]},{"text":"Why do questions about your surroundings work? Because they can only be answered here and now, they bring your perceptions back to the present.","pages":[474]},{"text":"To stop ruminating and ease depressive states, you want to inhibit the default mode network. Practicing present-tethered awareness does just that.","pages":[481]}],"steps":[{"text":"Periodically check: are your thoughts on what you're doing and where you are, or on the past or future? Be honest with your answer.","pages":[474]},{"text":"If your mind is elsewhere, ask questions about where you are right now: How warm is the room? What does it smell like?","pages":[474]},{"text":"Whenever you can, bring your thoughts back to what you're doing—and don't scold yourself for letting your mind wander.","pages":[478]},{"text":"Tend to daydream? Try to do it during activities that don't need much focus.","pages":[478]},{"text":"On your phone? Ask whether you're numbing out, or getting drawn in by things you can't actually have an impact on.","pages":[479]},{"text":"Try Andy Stumpf's exercise: split a page down the middle. On the left, list what concerns you; on the right, what you can control and do today.","page
